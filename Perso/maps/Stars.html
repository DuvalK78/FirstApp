<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Caelestis</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --void:#00000f; --deep:#04061a; --gold:#f0c060;
  --gold-dim:rgba(240,192,96,0.5); --silver:#c8d8f0;
  --cyan:#60c8f0; --text:#e8e0d0; --muted:rgba(232,224,208,0.45);
  --border:rgba(240,192,96,0.2); --horizon:#2a6080;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab;}
canvas:active{cursor:grabbing;}

/* HEADER */
header{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  padding:12px 20px;
  background:linear-gradient(to bottom,rgba(0,0,15,0.96) 60%,transparent);
  pointer-events:none;
}
.logo{
  font-family:'Cinzel',serif;font-size:1rem;font-weight:700;
  color:var(--gold);letter-spacing:0.15em;pointer-events:auto;
}
.logo span{color:var(--silver);font-weight:400;}
.controls{display:flex;align-items:center;gap:10px;pointer-events:auto;flex-wrap:wrap;}

/* SWITCH */
.view-switch{
  display:flex;background:rgba(4,6,26,0.85);
  border:1px solid var(--border);border-radius:20px;padding:3px;gap:2px;
}
.view-btn{
  font-family:'Cinzel',serif;font-size:0.6rem;font-weight:600;letter-spacing:0.08em;
  padding:5px 12px;border:none;border-radius:16px;cursor:pointer;
  transition:all 0.3s;color:var(--muted);background:transparent;
}
.view-btn.active{background:rgba(240,192,96,0.15);color:var(--gold);box-shadow:0 0 10px rgba(240,192,96,0.15);}
.view-btn.realtime-active{background:rgba(96,200,240,0.15);color:var(--cyan);box-shadow:0 0 10px rgba(96,200,240,0.2);}

/* CLOCK (mode temps réel) */
.clock-bar{
  display:none;
  font-family:'Crimson Pro',serif;font-size:0.78rem;color:var(--cyan);
  background:rgba(4,6,26,0.8);border:1px solid rgba(96,200,240,0.2);
  border-radius:8px;padding:4px 12px;letter-spacing:0.05em;
}

/* LOCATION BAR */
.loc-bar{
  display:none;
  align-items:center;gap:8px;
  background:rgba(4,6,26,0.8);border:1px solid var(--border);
  border-radius:8px;padding:4px 10px;
}
.loc-bar input{
  font-family:'Crimson Pro',serif;font-size:0.72rem;color:var(--text);
  background:transparent;border:none;outline:none;width:140px;
}
.loc-bar input::placeholder{color:var(--muted);}
.loc-btn{
  font-family:'Cinzel',serif;font-size:0.55rem;font-weight:600;
  color:var(--gold);background:transparent;border:none;cursor:pointer;
  padding:2px 6px;border-radius:6px;transition:background 0.2s;letter-spacing:0.08em;
}
.loc-btn:hover{background:rgba(240,192,96,0.1);}

/* INFO PANEL */
.info-panel{
  position:fixed;bottom:24px;left:24px;z-index:200;
  background:rgba(4,6,26,0.9);border:1px solid var(--border);border-radius:12px;
  padding:14px 18px;max-width:230px;backdrop-filter:blur(12px);
  transform:translateY(100px);opacity:0;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);pointer-events:none;
}
.info-panel.visible{transform:translateY(0);opacity:1;}
.info-name{font-family:'Cinzel',serif;font-size:0.88rem;font-weight:600;color:var(--gold);margin-bottom:2px;}
.info-const{font-family:'Crimson Pro',serif;font-style:italic;font-size:0.8rem;color:var(--silver);margin-bottom:6px;}
.info-detail{font-family:'Crimson Pro',serif;font-size:0.73rem;color:var(--muted);line-height:1.6;}

/* LEGEND */
.legend{
  position:fixed;bottom:24px;right:24px;z-index:200;
  background:rgba(4,6,26,0.75);border:1px solid var(--border);
  border-radius:10px;padding:11px 15px;backdrop-filter:blur(10px);
}
.legend-title{font-family:'Cinzel',serif;font-size:0.52rem;font-weight:600;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;margin-bottom:7px;}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-family:'Crimson Pro',serif;font-size:0.7rem;color:var(--muted);}
.legend-star{border-radius:50%;flex-shrink:0;background:var(--gold);box-shadow:0 0 5px var(--gold-dim);}
.legend-horizon{width:20px;height:2px;background:var(--horizon);flex-shrink:0;}

/* GEO STATUS */
.geo-status{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;
  font-family:'Crimson Pro',serif;font-style:italic;
  color:var(--cyan);font-size:0.9rem;letter-spacing:0.05em;
  background:rgba(4,6,26,0.9);border:1px solid rgba(96,200,240,0.2);
  border-radius:12px;padding:16px 28px;display:none;
}

/* HINT */
.hint3d{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:100;
  font-family:'Crimson Pro',serif;font-style:italic;font-size:0.7rem;
  color:var(--muted);pointer-events:none;display:none;text-align:center;
}
</style>
</head>
<body>

<header>
  <div class="logo">Carta <span>Caelestis</span></div>
  <div class="controls">
    <div class="view-switch">
      <button class="view-btn active"  id="btn2d">2D</button>
      <button class="view-btn"         id="btn3d">3D</button>
      <button class="view-btn"         id="btnRT">Temps réel</button>
    </div>
    <div class="clock-bar" id="clockBar">—</div>
    <div class="loc-bar" id="locBar">
      <input id="locInput" type="text" placeholder="ex: 48.8566, 2.3522" />
      <button class="loc-btn" id="locApply">OK</button>
      <button class="loc-btn" id="locGps">GPS</button>
    </div>
  </div>
</header>

<canvas id="sky"></canvas>

<div class="info-panel" id="infoPanel">
  <div class="info-name"   id="infoName">—</div>
  <div class="info-const"  id="infoConst">—</div>
  <div class="info-detail" id="infoDetail">—</div>
</div>

<div class="legend" id="legend">
  <div class="legend-title">Magnitude</div>
  <div class="legend-item"><div class="legend-star" style="width:9px;height:9px"></div>Très brillante</div>
  <div class="legend-item"><div class="legend-star" style="width:5px;height:5px;opacity:0.8"></div>Brillante</div>
  <div class="legend-item"><div class="legend-star" style="width:3px;height:3px;opacity:0.55"></div>Visible</div>
  <div class="legend-item legend-horizon-row" style="display:none">
    <div class="legend-horizon"></div>Horizon
  </div>
</div>

<div class="geo-status" id="geoStatus">Localisation en cours…</div>
<div class="hint3d" id="hint3d">Cliquez et faites glisser · Molette pour zoomer</div>

<script>
// ═══════════════════════════════════════
// DONNÉES ÉTOILES
// ═══════════════════════════════════════
const STARS = [

  ["Rigil Kent.",14.66,-60.83,-0.01,"Centaure"],

  ["Almach",2.07,42.33,2.10,"Andromède"],
  ["Hamal",2.12,23.46,2.00,"Bélier"],
  ["Denebola",11.82,14.57,2.14,"Lion"],
  ["Algieba",10.33,19.84,2.01,"Lion"],
  ["Regulus",10.14,11.97,1.35,"Lion"],
  ["Graffias",16.09,-19.81,2.62,"Scorpion"],
  ["Dschubba",16.00,-22.62,2.29,"Scorpion"],
  ["Sargas",17.62,-42.99,1.86,"Scorpion"],
  ["Shaula",17.56,-37.10,1.62,"Scorpion"],
  ["Kaus Australis",18.40,-34.38,1.79,"Sagittaire"],
  ["Nunki",18.92,-26.30,2.05,"Sagittaire"],
  ["Murzim",6.38,-17.96,1.98,"Grand Chien"],
  ["Adhara",6.98,-28.97,1.50,"Grand Chien"],
  ["Wezen",7.14,-26.39,1.83,"Grand Chien"],
  ["Gomeisa",7.45,8.29,2.89,"Petit Chien"],
  ["Eltanin",17.94,51.49,2.24,"Dragon"],
  ["Deneb Kaïtos",0.73,-17.98,2.04,"Baleine"],
  ["Fomalhaut",22.96,-29.62,1.16,"Poisson austral"],
  ["Sadalsuud",21.53,-5.57,2.87,"Verseau"],
];

const CONSTELLATIONS = [
  {name:"Orion",        lines:[[5,8],[8,17],[17,19],[19,20],[20,21],[21,5],[19,5]]},
  {name:"Grande Ourse", lines:[[28,29],[29,30],[30,31],[31,32],[32,33],[33,31]]},
  {name:"Cassiopée",    lines:[[36,37],[37,38],[38,39]]},
  {name:"Scorpion",     lines:[[11,52],[52,53],[53,54],[54,55]]},
  {name:"Sagittaire",   lines:[[56,57]]},
  {name:"Pégase",       lines:[[42,43],[43,44],[44,45]]},
  {name:"Lion",         lines:[[15,49],[49,50],[50,15]]},
  {name:"Andromède",    lines:[[45,46],[46,47]]},
  {name:"Petite Ourse", lines:[[34,35]]},
];

// ═══════════════════════════════════════
// ASTRONOMIE
// ═══════════════════════════════════════
const DEG = Math.PI/180;

// Julian Day Number
function julianDay(date) {
  return date.getTime()/86400000 + 2440587.5;
}

// Temps Sidéral de Greenwich (en heures)
function greenwichSiderealTime(jd) {
  const T = (jd - 2451545.0) / 36525;
  let gst = 280.46061837 + 360.98564736629*(jd-2451545)
          + 0.000387933*T*T - T*T*T/38710000;
  return ((gst % 360) + 360) % 360; // degrés
}

// Temps Sidéral Local
function localSiderealTime(jd, lonDeg) {
  return (greenwichSiderealTime(jd) + lonDeg + 360) % 360;
}

// RA/Dec → Altitude/Azimut
function equatorialToHorizontal(ra_h, dec_deg, lat_deg, lst_deg) {
  const ra  = ra_h * 15 * DEG;       // RA en radians
  const dec = dec_deg * DEG;
  const lat = lat_deg * DEG;
  const lst = lst_deg * DEG;

  const H = lst - ra_h*15*DEG; // angle horaire en rad (approx)
  const HA = (lst_deg - ra_h*15 + 360) % 360 * DEG;

  const sinAlt = Math.sin(dec)*Math.sin(lat) + Math.cos(dec)*Math.cos(lat)*Math.cos(HA);
  const alt = Math.asin(Math.max(-1,Math.min(1,sinAlt)));

  const cosAz = (Math.sin(dec) - Math.sin(alt)*Math.sin(lat)) / (Math.cos(alt)*Math.cos(lat));
  let az = Math.acos(Math.max(-1,Math.min(1,cosAz)));
  if (Math.sin(HA) > 0) az = 2*Math.PI - az;

  return {
    alt: alt / DEG,        // altitude en degrés (>0 = visible)
    az:  az  / DEG,        // azimut en degrés (0=N, 90=E, 180=S, 270=O)
  };
}

// ═══════════════════════════════════════
// ÉTAT GLOBAL
// ═══════════════════════════════════════
let mode = '2d';
let obsLat = 48.85, obsLon = 2.35; // Paris par défaut
let zoom2d = 1.4, offX2d = 0, offY2d = 0;
let drag2d = false, lastX2d = 0, lastY2d = 0;
let rotX = 0.3, rotY = 0, zoom3d = 1.0;
let drag3d = false, lastX3d = 0, lastY3d = 0;
let rtInterval = null;

const canvas = document.getElementById('sky');
const ctx    = canvas.getContext('2d');

// ═══════════════════════════════════════
// FOND ÉTOILÉ
// ═══════════════════════════════════════
let bgStars = [];
function genBg(n=700) {
  bgStars = [];
  for (let i=0;i<n;i++) bgStars.push({x:Math.random(),y:Math.random(),r:Math.random()*0.8+0.2,a:Math.random()*0.4+0.1});
}
genBg();

function drawBg() {
  const W=canvas.width, H=canvas.height;
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  g.addColorStop(0,'#07091e'); g.addColorStop(1,'#00000f');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const m=ctx.createLinearGradient(0,H*0.2,W,H*0.8);
  m.addColorStop(0,'rgba(100,120,200,0)');
  m.addColorStop(0.5,'rgba(120,140,220,0.06)');
  m.addColorStop(1,'rgba(100,120,200,0)');
  ctx.fillStyle=m; ctx.fillRect(0,0,W,H);
  for(const s of bgStars){
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,215,240,${s.a})`; ctx.fill();
  }
}

// ═══════════════════════════════════════
// HELPERS ÉTOILES
// ═══════════════════════════════════════
function magR(m){ return Math.max(1, 3.5 - m*0.45); }
function magA(m){ return Math.max(0.25, Math.min(1, 1 - m*0.1)); }
function magC(m){
  if(m<0.5)  return '#fff8e0';
  if(m<1.5)  return '#f0e8d0';
  if(m<2.5)  return '#d0d8f0';
  return '#b0c0e0';
}

function drawStarAt(x,y,mag,bright=true){
  const r=magR(mag), c=magC(mag), a=magA(mag);
  if(bright && mag<1.5){
    const g=ctx.createRadialGradient(x,y,0,x,y,r*6);
    g.addColorStop(0,`rgba(240,232,200,${a*0.35})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(x,y,r*6,0,Math.PI*2);
    ctx.fillStyle=g; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=c; ctx.globalAlpha=a; ctx.fill(); ctx.globalAlpha=1;
}

// ═══════════════════════════════════════
// DRAW 2D
// ═══════════════════════════════════════
function raDecToXY(ra,dec,W,H){
  const x = ((ra/24)*W*zoom2d + offX2d + W*100) % (W*zoom2d);
  const y = H/2 - (dec/90)*(H/2*zoom2d) + offY2d;
  return [x,y];
}

function draw2D(){
  const W=canvas.width, H=canvas.height;
  drawBg();
  // Grille
  ctx.strokeStyle='rgba(240,192,96,0.05)'; ctx.lineWidth=1;
  for(let ra=0;ra<=24;ra+=2){const[x]=raDecToXY(ra,0,W,H);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let dec=-80;dec<=80;dec+=20){const[,y]=raDecToXY(0,dec,W,H);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Équateur
  ctx.strokeStyle='rgba(96,200,240,0.12)'; ctx.lineWidth=1.5; ctx.setLineDash([6,8]);
  const[,yeq]=raDecToXY(0,0,W,H); ctx.beginPath();ctx.moveTo(0,yeq);ctx.lineTo(W,yeq);ctx.stroke();
  ctx.setLineDash([]);
  // Constellations
  ctx.strokeStyle='rgba(240,192,96,0.22)'; ctx.lineWidth=0.8; ctx.setLineDash([3,5]);
  for(const c of CONSTELLATIONS) for(const[a,b] of c.lines){
    if(!STARS[a]||!STARS[b]) continue;
    const[x1,y1]=raDecToXY(STARS[a][1],STARS[a][2],W,H);
    const[x2,y2]=raDecToXY(STARS[b][1],STARS[b][2],W,H);
    if(Math.abs(x2-x1)>W*0.5) continue;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  ctx.setLineDash([]);
  // Noms constellations
  const cc={};
  for(const s of STARS){const n=s[4];if(!cc[n])cc[n]={ra:0,dec:0,k:0};cc[n].ra+=s[1];cc[n].dec+=s[2];cc[n].k++;}
  ctx.font='600 0.58rem Cinzel,serif'; ctx.fillStyle='rgba(240,192,96,0.42)'; ctx.textAlign='center';
  for(const[n,c] of Object.entries(cc)){
    if(c.k<2) continue;
    const[cx,cy]=raDecToXY(c.ra/c.k,c.dec/c.k,W,H);
    if(cx<-20||cx>W+20||cy<-20||cy>H+20) continue;
    ctx.fillText(n.toUpperCase(),cx,cy-16);
  }
  // Étoiles
  for(const[name,ra,dec,mag] of STARS){
    const[x,y]=raDecToXY(ra,dec,W,H);
    if(x<-10||x>W+10||y<-10||y>H+10) continue;
    drawStarAt(x,y,mag);
    if(mag<1.5){
      ctx.font='italic 300 0.63rem "Crimson Pro",serif';
      ctx.fillStyle='rgba(200,216,240,0.7)'; ctx.textAlign='left';
      ctx.fillText(name,x+magR(mag)+5,y+4);
    }
  }
  ctx.font='0.52rem Cinzel,serif'; ctx.fillStyle='rgba(96,200,240,0.38)'; ctx.textAlign='left';
  ctx.fillText('ÉQUATEUR CÉLESTE',12,yeq-5);
}

// ═══════════════════════════════════════
// DRAW 3D
// ═══════════════════════════════════════
function s3(ra,dec){
  const p=(ra/24)*Math.PI*2, t=(dec/180)*Math.PI;
  return [Math.cos(t)*Math.cos(p), Math.sin(t), Math.cos(t)*Math.sin(p)];
}
function rY(x,y,z,a){return [x*Math.cos(a)+z*Math.sin(a),y,-x*Math.sin(a)+z*Math.cos(a)];}
function rX(x,y,z,a){return [x,y*Math.cos(a)-z*Math.sin(a),y*Math.sin(a)+z*Math.cos(a)];}
function proj(x,y,z,W,H){
  const fov=zoom3d*Math.min(W,H)*0.42, sc=fov/(z+2.2);
  return [W/2+x*sc, H/2-y*sc, z, sc];
}
function rot(x,y,z){[x,y,z]=rY(x,y,z,rotY);[x,y,z]=rX(x,y,z,rotX);return[x,y,z];}

function draw3D(){
  const W=canvas.width,H=canvas.height; drawBg();
  // Grille
  ctx.strokeStyle='rgba(240,192,96,0.06)'; ctx.lineWidth=0.8;
  for(let ra=0;ra<24;ra+=2){
    ctx.beginPath(); let f=true;
    for(let dec=-90;dec<=90;dec+=5){
      let[x,y,z]=s3(ra,dec);[x,y,z]=rot(x,y,z);
      if(z<-0.5){f=true;continue;}
      const[px,py]=proj(x,y,z,W,H);
      f?ctx.moveTo(px,py):ctx.lineTo(px,py);f=false;
    } ctx.stroke();
  }
  for(let dec=-60;dec<=60;dec+=30){
    ctx.beginPath(); let f=true;
    for(let ra=0;ra<=24;ra+=0.5){
      let[x,y,z]=s3(ra,dec);[x,y,z]=rot(x,y,z);
      if(z<-0.5){f=true;continue;}
      const[px,py]=proj(x,y,z,W,H);
      f?ctx.moveTo(px,py):ctx.lineTo(px,py);f=false;
    } ctx.stroke();
  }
  // Équateur
  ctx.strokeStyle='rgba(96,200,240,0.18)'; ctx.lineWidth=1.5;
  ctx.beginPath(); let fe=true;
  for(let ra=0;ra<=24;ra+=0.3){
    let[x,y,z]=s3(ra,0);[x,y,z]=rot(x,y,z);
    if(z<-0.3){fe=true;continue;}
    const[px,py]=proj(x,y,z,W,H);
    fe?ctx.moveTo(px,py):ctx.lineTo(px,py);fe=false;
  } ctx.stroke();
  // Constellations
  ctx.setLineDash([3,5]); ctx.lineWidth=0.8; ctx.strokeStyle='rgba(240,192,96,0.28)';
  for(const c of CONSTELLATIONS) for(const[a,b] of c.lines){
    if(!STARS[a]||!STARS[b]) continue;
    let[x1,y1,z1]=s3(STARS[a][1],STARS[a][2]); [x1,y1,z1]=rot(x1,y1,z1);
    let[x2,y2,z2]=s3(STARS[b][1],STARS[b][2]); [x2,y2,z2]=rot(x2,y2,z2);
    if(z1<0||z2<0) continue;
    const[px1,py1]=proj(x1,y1,z1,W,H), [px2,py2]=proj(x2,y2,z2,W,H);
    ctx.beginPath();ctx.moveTo(px1,py1);ctx.lineTo(px2,py2);ctx.stroke();
  }
  ctx.setLineDash([]);
  // Étoiles
  for(const[name,ra,dec,mag] of STARS){
    let[x,y,z]=s3(ra,dec);[x,y,z]=rot(x,y,z);
    if(z<0) continue;
    const[px,py,,sc]=proj(x,y,z,W,H);
    if(px<0||px>W||py<0||py>H) continue;
    const r=Math.max(1,magR(mag)*Math.min(sc*0.4,1.8));
    // halo
    if(mag<1.5){const g=ctx.createRadialGradient(px,py,0,px,py,r*6);g.addColorStop(0,`rgba(240,232,200,${magA(mag)*0.32})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.beginPath();ctx.arc(px,py,r*6,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}
    ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fillStyle=magC(mag);ctx.globalAlpha=magA(mag);ctx.fill();ctx.globalAlpha=1;
    if(mag<1.5&&sc>0.3){ctx.font='italic 300 0.63rem "Crimson Pro",serif';ctx.fillStyle='rgba(200,216,240,0.72)';ctx.textAlign='left';ctx.fillText(name,px+r+5,py+4);}
  }
  // Noms constellations
  const cc={}; for(const s of STARS){const n=s[4];if(!cc[n])cc[n]={ra:0,dec:0,k:0};cc[n].ra+=s[1];cc[n].dec+=s[2];cc[n].k++;}
  ctx.font='600 0.56rem Cinzel,serif'; ctx.fillStyle='rgba(240,192,96,0.48)'; ctx.textAlign='center';
  for(const[n,c] of Object.entries(cc)){
    if(c.k<2) continue;
    let[x,y,z]=s3(c.ra/c.k,c.dec/c.k);[x,y,z]=rot(x,y,z);
    if(z<0.1) continue;
    const[px,py]=proj(x,y,z,W,H);
    ctx.fillText(n.toUpperCase(),px,py-14);
  }
}

// ═══════════════════════════════════════
// DRAW TEMPS RÉEL (projection azimutale)
// ═══════════════════════════════════════
// Projection stéréographique : le zénith est au centre,
// l'horizon est le cercle extérieur, Nord en bas (comme une vraie carte du ciel)
function drawRealTime(){
  const W=canvas.width, H=canvas.height;
  const cx=W/2, cy=H/2;
  const R=Math.min(W,H)*0.42; // rayon de l'horizon

  drawBg();

  const now=new Date();
  const jd=julianDay(now);
  const lst=localSiderealTime(jd, obsLon);

  // Dégradé horizon → zénith
  const atmoGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  atmoGrad.addColorStop(0,'rgba(0,0,20,0)');
  atmoGrad.addColorStop(0.85,'rgba(0,0,20,0)');
  atmoGrad.addColorStop(1,'rgba(10,30,60,0.6)');
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle=atmoGrad;ctx.fill();

  // Grilles d'altitude (cercles concentriques)
  for(let alt=0;alt<=90;alt+=30){
    const r=R*(1-alt/90);
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=alt===0?'rgba(96,200,240,0.35)':'rgba(240,192,96,0.08)';
    ctx.lineWidth= alt===0?1.5:0.8;
    ctx.stroke();
    if(alt>0&&alt<90){
      ctx.font='0.55rem Cinzel,serif';ctx.fillStyle='rgba(240,192,96,0.35)';ctx.textAlign='left';
      ctx.fillText(alt+'°',cx+r+3,cy+4);
    }
  }

  // Méridiens azimut
  ctx.strokeStyle='rgba(240,192,96,0.06)'; ctx.lineWidth=0.7;
  for(let az=0;az<360;az+=30){
    const rad=az*DEG;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.sin(rad)*R, cy-Math.cos(rad)*R);
    ctx.stroke();
  }

  // Points cardinaux
  const cards=[['N',0],['NE',45],['E',90],['SE',135],['S',180],['SO',225],['O',270],['NO',315]];
  ctx.font='700 0.72rem Cinzel,serif';
  for(const[label,az] of cards){
    const rad=az*DEG;
    const px=cx+Math.sin(rad)*(R+18);
    const py=cy-Math.cos(rad)*(R+18);
    ctx.fillStyle= ['N','S','E','O'].includes(label)?'rgba(96,200,240,0.9)':'rgba(200,216,240,0.4)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,px,py);
  }
  ctx.textBaseline='alphabetic';

  // Constellations (lignes)
  ctx.setLineDash([3,5]); ctx.lineWidth=0.8;
  for(const c of CONSTELLATIONS) for(const[a,b] of c.lines){
    if(!STARS[a]||!STARS[b]) continue;
    const ha=equatorialToHorizontal(STARS[a][1],STARS[a][2],obsLat,lst);
    const hb=equatorialToHorizontal(STARS[b][1],STARS[b][2],obsLat,lst);
    if(ha.alt<0||hb.alt<0) continue;
    const ra=(90-ha.alt)/90*R, rb=(90-hb.alt)/90*R;
    const px1=cx+Math.sin(ha.az*DEG)*ra, py1=cy-Math.cos(ha.az*DEG)*ra;
    const px2=cx+Math.sin(hb.az*DEG)*rb, py2=cy-Math.cos(hb.az*DEG)*rb;
    ctx.strokeStyle='rgba(240,192,96,0.28)';
    ctx.beginPath();ctx.moveTo(px1,py1);ctx.lineTo(px2,py2);ctx.stroke();
  }
  ctx.setLineDash([]);

  // Étoiles
  const constCenters={};
  for(let i=0;i<STARS.length;i++){
    const[name,ra,dec,mag,cname]=STARS[i];
    const h=equatorialToHorizontal(ra,dec,obsLat,lst);
    if(h.alt<-5) continue; // sous l'horizon

    const distFromCenter=(90-h.alt)/90*R;
    const px=cx+Math.sin(h.az*DEG)*distFromCenter;
    const py=cy-Math.cos(h.az*DEG)*distFromCenter;

    // Étoile sous l'horizon légèrement (0°→-5°) : afficher en transparent
    const belowHorizon=h.alt<0;
    if(belowHorizon) ctx.globalAlpha=0.15;

    drawStarAt(px,py,mag,!belowHorizon);
    ctx.globalAlpha=1;

    if(mag<1.2&&!belowHorizon){
      ctx.font='italic 300 0.63rem "Crimson Pro",serif';
      ctx.fillStyle='rgba(200,216,240,0.75)'; ctx.textAlign='left';
      ctx.fillText(name,px+magR(mag)+5,py+4);
    }

    // Centroïde constellation
    if(!constCenters[cname]) constCenters[cname]={px:0,py:0,n:0,vis:0};
    constCenters[cname].px+=px; constCenters[cname].py+=py; constCenters[cname].n++;
    if(!belowHorizon) constCenters[cname].vis++;
  }

  // Noms constellations (si au moins 1 étoile visible)
  ctx.font='600 0.56rem Cinzel,serif'; ctx.textAlign='center';
  for(const[cn,c] of Object.entries(constCenters)){
    if(c.vis<1) continue;
    ctx.fillStyle='rgba(240,192,96,0.48)';
    ctx.fillText(cn.toUpperCase(), c.px/c.n, c.py/c.n-14);
  }

  // Cercle horizon
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(96,200,240,0.5)'; ctx.lineWidth=1.5; ctx.stroke();

  // Fond sous l'horizon (masque)
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  ctx.arc(cx,cy,R,0,Math.PI*2,true);
  ctx.fillStyle='rgba(0,0,10,0.75)'; ctx.fill();

  // Zénith
  ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);
  ctx.fillStyle='rgba(240,192,96,0.6)';ctx.fill();
  ctx.font='0.55rem Cinzel,serif';ctx.fillStyle='rgba(240,192,96,0.5)';ctx.textAlign='center';
  ctx.fillText('ZÉNITH',cx,cy-8);

  // Infos position
  ctx.font='0.6rem Crimson Pro,serif'; ctx.fillStyle='rgba(200,216,240,0.4)'; ctx.textAlign='left';
  ctx.fillText(`Lat ${obsLat.toFixed(2)}°  Lon ${obsLon.toFixed(2)}°`,12,H-14);
}

// ═══════════════════════════════════════
// DRAW PRINCIPAL
// ═══════════════════════════════════════
function draw(){ if(mode==='2d')draw2D(); else if(mode==='3d')draw3D(); else drawRealTime(); }

// ═══════════════════════════════════════
// HORLOGE TEMPS RÉEL
// ═══════════════════════════════════════
function updateClock(){
  const now=new Date();
  const jd=julianDay(now);
  const lst=localSiderealTime(jd,obsLon);
  const lstH=Math.floor(lst/15), lstM=Math.floor((lst%15)/15*60);
  document.getElementById('clockBar').textContent=
    now.toLocaleString('fr-FR',{weekday:'short',day:'2-digit',month:'short',
    hour:'2-digit',minute:'2-digit',second:'2-digit'})+
    `  ·  TSL ${String(lstH).padStart(2,'0')}h${String(lstM).padStart(2,'0')}`;
  draw();
}

// ═══════════════════════════════════════
// HOVER INFO
// ═══════════════════════════════════════
const infoPanel=document.getElementById('infoPanel');
let hoverTO=null;

function checkHover(mx,my){
  const W=canvas.width,H=canvas.height;
  const cx=W/2,cy=H/2,R=Math.min(W,H)*0.42;
  let found=null, best=16;

  for(let i=0;i<STARS.length;i++){
    const[name,ra,dec,mag,cname]=STARS[i];
    let px,py;

    if(mode==='2d'){
      [px,py]=raDecToXY(ra,dec,W,H);
    } else if(mode==='3d'){
      let[x,y,z]=s3(ra,dec);[x,y,z]=rot(x,y,z);
      if(z<0) continue;
      [px,py]=proj(x,y,z,W,H);
    } else {
      const jd=julianDay(new Date());
      const lst=localSiderealTime(jd,obsLon);
      const h=equatorialToHorizontal(ra,dec,obsLat,lst);
      if(h.alt<-5) continue;
      const d=(90-h.alt)/90*R;
      px=cx+Math.sin(h.az*DEG)*d;
      py=cy-Math.cos(h.az*DEG)*d;
    }

    const dist=Math.hypot(mx-px,my-py);
    if(dist<best){best=dist;
      const h2=mode==='realtime'?equatorialToHorizontal(ra,dec,obsLat,localSiderealTime(julianDay(new Date()),obsLon)):null;
      found={name,mag,cname,alt:h2?.alt,az:h2?.az};
    }
  }

  if(found){
    document.getElementById('infoName').textContent=found.name;
    document.getElementById('infoConst').textContent=found.cname;
    const magS=found.mag<0?found.mag.toFixed(2):'+'+found.mag.toFixed(2);
    let detail=`Magnitude : ${magS}`;
    if(found.alt!=null) detail+=`\nAltitude : ${found.alt.toFixed(1)}°\nAzimut : ${found.az.toFixed(1)}°`;
    document.getElementById('infoDetail').textContent=detail;
    infoPanel.classList.add('visible');
    clearTimeout(hoverTO);
  } else {
    clearTimeout(hoverTO);
    hoverTO=setTimeout(()=>infoPanel.classList.remove('visible'),600);
  }
}

// ═══════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════
canvas.addEventListener('mousedown',e=>{
  if(mode==='2d'){drag2d=true;lastX2d=e.clientX;lastY2d=e.clientY;}
  else if(mode==='3d'){drag3d=true;lastX3d=e.clientX;lastY3d=e.clientY;}
});
canvas.addEventListener('mousemove',e=>{
  if(mode==='2d'&&drag2d){offX2d+=e.clientX-lastX2d;offY2d+=e.clientY-lastY2d;lastX2d=e.clientX;lastY2d=e.clientY;draw();}
  if(mode==='3d'&&drag3d){
    rotY+=(e.clientX-lastX3d)*0.005;rotX+=(e.clientY-lastY3d)*0.005;
    rotX=Math.max(-Math.PI/2,Math.min(Math.PI/2,rotX));
    lastX3d=e.clientX;lastY3d=e.clientY;draw();
  }
  if(!drag2d&&!drag3d) checkHover(e.clientX,e.clientY);
});
canvas.addEventListener('mouseup',()=>{drag2d=false;drag3d=false;});
canvas.addEventListener('mouseleave',()=>{drag2d=false;drag3d=false;});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(mode==='2d') zoom2d=Math.max(0.6,Math.min(4,zoom2d-e.deltaY*0.001));
  else if(mode==='3d') zoom3d=Math.max(0.5,Math.min(3,zoom3d-e.deltaY*0.001));
  draw();
},{passive:false});

// Touch
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length!==1) return;
  if(mode==='2d'){drag2d=true;lastX2d=e.touches[0].clientX;lastY2d=e.touches[0].clientY;}
  else if(mode==='3d'){drag3d=true;lastX3d=e.touches[0].clientX;lastY3d=e.touches[0].clientY;}
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length!==1) return;
  const tx=e.touches[0].clientX,ty=e.touches[0].clientY;
  if(mode==='2d'&&drag2d){offX2d+=tx-lastX2d;offY2d+=ty-lastY2d;lastX2d=tx;lastY2d=ty;draw();}
  if(mode==='3d'&&drag3d){
    rotY+=(tx-lastX3d)*0.005;rotX+=(ty-lastY3d)*0.005;
    rotX=Math.max(-Math.PI/2,Math.min(Math.PI/2,rotX));
    lastX3d=tx;lastY3d=ty;draw();
  }
},{passive:true});
canvas.addEventListener('touchend',()=>{drag2d=false;drag3d=false;});

// ═══════════════════════════════════════
// SWITCH MODES
// ═══════════════════════════════════════
function setMode(m){
  mode=m;
  ['btn2d','btn3d','btnRT'].forEach(id=>document.getElementById(id).className='view-btn');
  const activeId=m==='2d'?'btn2d':m==='3d'?'btn3d':'btnRT';
  const btn=document.getElementById(activeId);
  btn.className='view-btn '+(m==='realtime'?'realtime-active':'active');
  document.getElementById('clockBar').style.display=m==='realtime'?'block':'none';
  document.getElementById('locBar').style.display=m==='realtime'?'flex':'none';
  document.getElementById('hint3d').style.display=m==='3d'?'block':'none';
  document.querySelector('.legend-horizon-row').style.display=m==='realtime'?'flex':'none';
  clearInterval(rtInterval);
  if(m==='realtime'){
    updateClock();
    rtInterval=setInterval(updateClock,1000);
  } else draw();
}

document.getElementById('btn2d').addEventListener('click',()=>setMode('2d'));
document.getElementById('btn3d').addEventListener('click',()=>setMode('3d'));
document.getElementById('btnRT').addEventListener('click',()=>setMode('realtime'));

// ═══════════════════════════════════════
// GÉOLOCALISATION
// ═══════════════════════════════════════
function setLocation(lat,lon){
  obsLat=lat; obsLon=lon;
  document.getElementById('locInput').value=`${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  if(mode==='realtime') updateClock();
}

document.getElementById('locGps').addEventListener('click',()=>{
  const gs=document.getElementById('geoStatus');
  gs.textContent='Localisation GPS en cours…'; gs.style.display='block';
  navigator.geolocation.getCurrentPosition(
    p=>{ setLocation(p.coords.latitude,p.coords.longitude); gs.style.display='none'; },
    ()=>{ gs.textContent='Localisation refusée — position par défaut (Paris)'; setTimeout(()=>gs.style.display='none',2500); }
  );
});

document.getElementById('locApply').addEventListener('click',()=>{
  const v=document.getElementById('locInput').value;
  const parts=v.split(',').map(s=>parseFloat(s.trim()));
  if(parts.length===2&&!isNaN(parts[0])&&!isNaN(parts[1])){
    setLocation(parts[0],parts[1]);
  }
});

document.getElementById('locInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('locApply').click();
});

// ═══════════════════════════════════════
// RESIZE + ANIMATION
// ═══════════════════════════════════════
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;draw();}
window.addEventListener('resize',resize);

let lastTw=0;
function animate(ts){
  if(mode!=='realtime'&&ts-lastTw>90){
    for(const s of bgStars){s.a+=(Math.random()-0.5)*0.04;s.a=Math.max(0.05,Math.min(0.6,s.a));}
    draw(); lastTw=ts;
  }
  requestAnimationFrame(animate);
}

// ═══════════════════════════════════════
// INIT — Géoloc automatique au démarrage
// ═══════════════════════════════════════
resize();
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    p=>setLocation(p.coords.latitude,p.coords.longitude),
    ()=>{} // Paris par défaut déjà défini
  );
}
requestAnimationFrame(animate);
</script>
