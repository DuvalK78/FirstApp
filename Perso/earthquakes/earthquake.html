<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séismes Significatifs</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: white;
        }
        
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #f87171;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 15px 20px;
            border-radius: 10px;
            min-width: 120px;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fca5a5;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-top: 5px;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .panel {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        .panel-header {
            background: rgba(15, 23, 42, 0.9);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .panel-content {
            padding: 20px;
        }
        
        #map {
            height: 600px;
            width: 100%;
            border-radius: 8px;
        }
        
        .legend {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding: 15px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid white;
        }
        
        .eq-list {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .eq-list::-webkit-scrollbar {
            width: 8px;
        }
        
        .eq-list::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
        }
        
        .eq-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 10px;
        }
        
        .eq-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 4px solid;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .eq-item:hover {
            background: rgba(30, 41, 59, 0.8);
            transform: translateX(3px);
        }
        
        .eq-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .eq-mag {
            font-size: 1.3rem;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 6px;
            color: white;
        }
        
        .eq-date {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        
        .eq-place {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #e2e8f0;
        }
        
        .eq-info {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(239, 68, 68, 0.3);
            border-top-color: #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <div>Chargement des données...</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let earthquakes = [];

        function getColor(mag) {
            mag = parseFloat(mag);
            if (mag >= 7) return '#dc2626';
            if (mag >= 6) return '#ea580c';
            if (mag >= 5) return '#f59e0b';
            return '#eab308';
        }

        function createMap() {
            map = L.map('map').setView([20, 0], 2);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            earthquakes.forEach((eq, i) => {
                const lat = parseFloat(eq.latitude);
                const lon = parseFloat(eq.longitude);
                const mag = parseFloat(eq.mag);
                const color = getColor(mag);

                const circle = L.circleMarker([lat, lon], {
                    radius: Math.max(8, mag * 2.5),
                    fillColor: color,
                    color: '#fff',
                    weight: 2,
                    fillOpacity: 0.7
                }).addTo(map);

                circle.bindPopup(`
                    <div style="color: #1e293b; min-width: 200px;">
                        <div style="font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; color: ${color};">
                            Magnitude ${mag}
                        </div>
                        <div style="margin-bottom: 5px;"><strong>Lieu:</strong> ${eq.place}</div>
                        <div style="margin-bottom: 5px;"><strong>Profondeur:</strong> ${eq.depth} km</div>
                        <div style="margin-bottom: 5px;"><strong>Date:</strong> ${new Date(eq.time).toLocaleString('fr-FR')}</div>
                        <div><strong>Coordonnées:</strong> ${lat.toFixed(2)}°, ${lon.toFixed(2)}°</div>
                    </div>
                `);

                circle._eqIndex = i;
            });
        }

        function zoomTo(index) {
            const eq = earthquakes[index];
            const lat = parseFloat(eq.latitude);
            const lon = parseFloat(eq.longitude);
            map.setView([lat, lon], 6);
            
            map.eachLayer(layer => {
                if (layer._eqIndex === index) {
                    layer.openPopup();
                }
            });
        }

        function render() {
            const total = earthquakes.length;
            const maxMag = Math.max(...earthquakes.map(e => parseFloat(e.mag)));
            const avgMag = (earthquakes.reduce((s, e) => s + parseFloat(e.mag), 0) / total).toFixed(1);
            const major = earthquakes.filter(e => parseFloat(e.mag) >= 7).length;

            document.getElementById('app').innerHTML = `
                <div class="header">
                    <h1>🌍 Séismes Significatifs du Mois</h1>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value">${total}</div>
                            <div class="stat-label">Séismes</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${maxMag}</div>
                            <div class="stat-label">Magnitude max</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${avgMag}</div>
                            <div class="stat-label">Magnitude moy</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${major}</div>
                            <div class="stat-label">Majeurs (≥7)</div>
                        </div>
                        <div class="stat" style="background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.3);">
                            <div class="stat-value" style="color: #86efac; font-size: 0.9rem;">🔄 LIVE</div>
                            <div class="stat-label">Mise à jour: ${lastUpdate ? lastUpdate.toLocaleTimeString('fr-FR') : 'En cours...'}</div>
                        </div>
                    </div>
                </div>

                <div class="container">
                    <div class="panel">
                        <div class="panel-header">🗺️ Carte Mondiale Interactive</div>
                        <div class="panel-content">
                            <div id="map"></div>
                            <div class="legend">
                                <div class="legend-item">
                                    <div class="legend-color" style="background: #dc2626;"></div>
                                    <span>≥ 7.0</span>
                                </div>
                                <div class="legend-item">
                                    <div class="legend-color" style="background: #ea580c;"></div>
                                    <span>6.0-6.9</span>
                                </div>
                                <div class="legend-item">
                                    <div class="legend-color" style="background: #f59e0b;"></div>
                                    <span>5.0-5.9</span>
                                </div>
                                <div class="legend-item">
                                    <div class="legend-color" style="background: #eab308;"></div>
                                    <span>4.0-4.9</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header">📋 Liste des Événements</div>
                        <div class="panel-content">
                            <div class="eq-list">
                                ${earthquakes.map((eq, i) => {
                                    const color = getColor(eq.mag);
                                    return `
                                        <div class="eq-item" 
                                             style="border-left-color: ${color};"
                                             onclick="zoomTo(${i})">
                                            <div class="eq-top">
                                                <div class="eq-mag" style="background: ${color};">
                                                    M ${eq.mag}
                                                </div>
                                                <div class="eq-date">
                                                    ${new Date(eq.time).toLocaleDateString('fr-FR')}
                                                </div>
                                            </div>
                                            <div class="eq-place">${eq.place}</div>
                                            <div class="eq-info">
                                                <span>⬇️ ${eq.depth} km</span>
                                                <span>🕐 ${new Date(eq.time).toLocaleTimeString('fr-FR')}</span>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(createMap, 100);
        }

        let lastUpdate = null;
        const UPDATE_INTERVAL = 2 * 60 * 1000; // 2 minutes en millisecondes

        // CHOISIS TON FLUX ICI :
        // Pour les dernières 24h (tous séismes > 2.5) :
        const DATA_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.csv';
        
        // Autres options disponibles :
        // 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.csv' - Dernière heure (tous)
        // 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.csv' - Dernières 24h (mag 4.5+)
        // 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.csv' - Dernière semaine (mag 2.5+)
        // 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_week.csv' - Semaine (significatifs)

        function loadData() {
            // Ajouter un timestamp pour éviter le cache
            const url = DATA_URL + '?t=' + Date.now();
            
            fetch(url)
                .then(r => r.text())
                .then(csv => {
                    const lines = csv.trim().split('\n');
                    const headers = lines[0].split(',');
                    
                    earthquakes = lines.slice(1)
                        .map(line => {
                            const values = line.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g) || [];
                            const obj = {};
                            headers.forEach((h, i) => {
                                obj[h.trim()] = values[i] ? values[i].replace(/"/g, '').trim() : '';
                            });
                            return obj;
                        })
                        .filter(eq => eq.latitude && eq.longitude && eq.mag)
                        .sort((a, b) => parseFloat(b.mag) - parseFloat(a.mag));

                    lastUpdate = new Date();
                    render();
                    console.log('Données mises à jour:', lastUpdate.toLocaleTimeString('fr-FR'));
                })
                .catch(err => {
                    console.error('Erreur:', err);
                    if (!earthquakes.length) {
                        document.getElementById('app').innerHTML = `
                            <div class="loading">
                                <div class="error">
                                    <h2>❌ Erreur de chargement</h2>
                                    <p>${err.message}</p>
                                    <p style="margin-top: 10px; font-size: 0.9rem;">
                                        Vérifie ta connexion internet ou réessaye plus tard.
                                    </p>
                                </div>
                            </div>
                        `;
                    }
                });
        }

        // Chargement initial
        loadData();

        // Mise à jour automatique toutes les 5 minutes
        setInterval(loadData, UPDATE_INTERVAL);

        // Afficher un message toutes les minutes pour montrer que c'est actif
        setInterval(() => {
            if (lastUpdate) {
                const minutesAgo = Math.floor((Date.now() - lastUpdate) / 60000);
                console.log(`Dernière mise à jour: il y a ${minutesAgo} minute(s)`);
            }
        }, 60000);
    </script>
</body>
  </html>
