<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA Hub - Les 30 Franchises</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏀 NBA Hub</h1>
    <p>Guide des 30 équipes de la National Basketball Association</p>
    <input type="text" id="search" placeholder="Rechercher une équipe ou une ville...">
  </header>

  <main>
    <section class="conference">
      <h2>Eastern Conference</h2>
      <div class="grid" id="east-container"></div>

    <section class="conference">
      <h2>Western Conference</h2>
      <div class="grid" id="west-container"></div>
    </section>
  </main>

  <footer>
    <p>Projet NBA Hub - Déployé sur GitHub & Vercel</p>
  </footer>

  <script src="app.js"></script>
</body>
