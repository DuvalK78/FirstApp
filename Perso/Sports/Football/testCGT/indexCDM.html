<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">
            ⚽ WORLD CUP 2026
        </div>

        <div class="links">
            <a href="#">Accueil</a>
            <a href="#">Équipes</a>
            <a href="#">Groupes</a>
            <a href="#">Matchs</a>
            <a href="#">Stades</a>
        </div>
    </nav>

    <section class="hero">

        <div class="overlay"></div>

        <div class="hero-content">
            <h1>FIFA WORLD CUP 2026</h1>

            <p>
                48 équipes • 3 pays hôtes • Le plus grand tournoi de l'histoire
            </p>

            <div id="countdown"></div>
        </div>

    </section>

    <section class="search-section">

        <h2>Équipes qualifiées</h2>

        <input
            type="text"
            id="search"
            placeholder="Rechercher une équipe...">

    </section>

    <section id="teams-container"></section>

    <script src="app.js"></script>

</body>

</html>
