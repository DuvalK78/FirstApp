<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Capitales · CDM 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&family=DM+Mono&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --card: #0f0f1a; --border: #1e1e2e;
    --gold: #c8a84b; --green: #2a9d5c; --red: #e63946;
    --orange: #f4a261; --muted: #555; --text: #fff;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Bebas Neue', Impact, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px 16px;
  }
  #progress-bar-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: #1a1a2e; z-index: 100; }
  #progress-bar { height: 100%; width: 0%; background: var(--gold); transition: width 0.5s ease; }

  .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 480px; }
  .screen.active { display: flex; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 28px 22px; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .big-title { font-size: clamp(32px, 8vw, 56px); letter-spacing: 4px; line-height: 1; margin-bottom: 4px; }
  .gold { color: var(--gold); font-family: 'DM Sans', sans-serif; font-size: 13px; letter-spacing: 4px; }
  .muted { color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px; text-align: center; margin-top: 6px; }

  .count-wrap { display: flex; gap: 10px; margin: 16px 0 10px; flex-wrap: wrap; justify-content: center; }
  .count-btn { background: transparent; color: #888; border: 1px solid #2a2a3a; border-radius: 4px; padding: 10px 22px; font-size: 20px; font-family: 'Bebas Neue', Impact, sans-serif; cursor: pointer; transition: all 0.15s; }
  .count-btn.selected { background: var(--gold); color: #000; border-color: transparent; }

  /* MODE SELECTOR */
  .mode-section { width: 100%; margin-bottom: 14px; }
  .mode-section-label { font-family: 'DM Sans', sans-serif; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 8px; }
  .mode-wrap { display: flex; gap: 8px; width: 100%; }
  .mode-btn { flex: 1; background: transparent; color: #888; border: 1px solid #2a2a3a; border-radius: 4px; padding: 10px 8px; font-size: 16px; font-family: 'Bebas Neue', Impact, sans-serif; cursor: pointer; transition: all 0.15s; letter-spacing: 1px; }
  .mode-btn.selected { background: rgba(200,168,75,0.15); color: var(--gold); border-color: var(--gold); }

  .legend { width: 100%; display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; }
  .legend-row { display: flex; align-items: center; gap: 10px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--muted); }
  .legend-pts { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 14px; color: var(--gold); min-width: 40px; }
  .legend-pts.zero { color: var(--red); }

  .btn { background: var(--gold); color: #000; border: none; border-radius: 4px; padding: 12px; font-size: 14px; letter-spacing: 2px; font-family: 'Bebas Neue', Impact, sans-serif; cursor: pointer; font-weight: 700; width: 100%; text-decoration: none; display: block; text-align: center; }
  .btn a { color: #000; text-decoration: none; }
  .btn-ghost { background: transparent; color: #666; border: 1px solid #2a2a3a; border-radius: 4px; padding: 12px 16px; font-size: 14px; letter-spacing: 2px; font-family: 'Bebas Neue', Impact, sans-serif; cursor: pointer; }
  .btn-hint { background: #1a1208; color: var(--orange); border: 1px solid #f4a26144; border-radius: 4px; padding: 12px 16px; font-size: 13px; letter-spacing: 2px; font-family: 'Bebas Neue', Impact, sans-serif; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  .btn-hint:hover { background: #261a0a; }
  .btn-hint:disabled { opacity: 0.3; cursor: default; }
  .btn-row { display: flex; gap: 8px; width: 100%; }

  #game-header { display: flex; justify-content: space-between; width: 100%; max-width: 480px; padding: 20px 0 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; }
  #game-counter { color: var(--muted); }
  #game-score { color: var(--gold); font-weight: 700; }

  #country-display {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(28px, 7vw, 46px);
    letter-spacing: 2px; line-height: 1.15; text-align: center;
    margin-bottom: 4px; display: flex; align-items: center; gap: 14px;
    transition: color 0.3s;
  }
  #country-display .flag { font-size: clamp(36px, 9vw, 52px); line-height: 1; }
  #country-display.correct { color: var(--green); }
  #country-display.wrong   { color: var(--red); }

  #dots { display: flex; gap: 6px; margin-bottom: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #1e1e2e; border: 1px solid #333; transition: background 0.2s; }
  .dot.used { background: var(--red); }

  #hints { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .hint-box { display: flex; align-items: center; gap: 10px; background: #140f00; border: 1px solid #f4a26122; border-radius: 4px; padding: 8px 12px; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform: translateY(0); } }
  .hint-icon { font-size: 16px; }
  .hint-label { font-family: 'DM Sans', sans-serif; color: #555; font-size: 11px; min-width: 58px; }
  .hint-val { font-family: 'DM Mono', monospace; font-size: 14px; letter-spacing: 2px; color: var(--orange); }
  .hint-val.plain { font-family: 'DM Sans', sans-serif; letter-spacing: 0; }

  #feedback { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 6px; min-height: 24px; text-align: center; }

  /* SAISIE */
  #answer-input { width: 100%; background: #111118; border: 1px solid #2a2a3a; border-radius: 4px; padding: 12px 16px; color: #fff; font-size: 16px; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 10px; }
  #answer-input:focus { border-color: var(--gold); }

  /* QCM */
  #qcm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 10px; }
  .qcm-opt {
    background: #111118; border: 1px solid #2a2a3a; border-radius: 4px;
    padding: 12px 14px; color: var(--text);
    font-size: 14px; font-family: 'DM Sans', sans-serif;
    cursor: pointer; text-align: left; transition: all 0.15s; line-height: 1.3;
  }
  .qcm-opt:hover:not(:disabled) { background: #1a1a2e; border-color: var(--gold); }
  .qcm-opt.correct { background: #0d2b1a; border-color: var(--green); color: var(--green); font-weight: 700; pointer-events: none; }
  .qcm-opt.wrong   { background: #2b0d0d; border-color: var(--red); color: var(--red); pointer-events: none; }
  .qcm-opt.reveal  { background: #0d2b1a; border-color: var(--green); color: var(--green); pointer-events: none; }
  .qcm-opt:disabled { pointer-events: none; opacity: 0.6; }

  #history { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-top: 14px; max-width: 480px; width: 100%; min-height: 24px; }

  #results-list { width: 100%; max-height: 320px; overflow-y: auto; margin-bottom: 16px; }
  .result-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; margin-bottom: 3px; border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 14px; }
  .result-flag { font-size: 22px; }
  .result-name { flex: 1; }
  .result-capital { font-size: 12px; color: #888; flex: 1; }
  .result-pts { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 16px; color: var(--gold); }
</style>
</head>
<body>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<!-- ACCUEIL -->
<div id="screen-home" class="screen active">
  <div class="card">
    <div style="font-size:52px;margin-bottom:4px">🏛️</div>
    <h1 class="big-title">CAPITALES</h1>
    <p class="gold" style="margin-bottom:20px">COUPE DU MONDE 2026</p>

    <p class="muted" style="margin-bottom:4px">Combien de questions ?</p>
    <div class="count-wrap">
      <button class="count-btn" data-n="6">6</button>
      <button class="count-btn selected" data-n="12">12</button>

    <div class="mode-section">

    <div class="legend">

      <div class="legend-row"><span class="legend-pts">4 pts</span><span>Après indice longueur</span></div>

    <button class="btn" onclick="startGame()">JOUER</button>
    <br>
    <button class="btn"><a href="Quizz.html">Quiz Drapeaux</a></button>
    <button class="btn"><a href="Quiz-cdm2026.html">Quizz 2</a></button>
  </div>
</div>

<!-- JEU -->
<div id="screen-game" class="screen">
  <div id="game-header">
    <span id="game-counter">1 / 12</span>
    <span id="game-score">0 / 72 pts</span>
  </div>
  <div class="card">
    <div id="country-display"><span class="flag" id="q-flag">🌍</span><span id="q-country">Pays</span></div>
    <div id="dots"></div>
    <div id="hints"></div>
    <div id="feedback"></div>
    <!-- Saisie -->
    <input id="answer-input" type="text" placeholder="Quelle est la capitale ?" autocomplete="off" autocorrect="off" spellcheck="false" style="display:none">
    <!-- QCM -->
    <div id="qcm-grid" style="display:none"></div>
    <!-- Actions -->
    <div class="btn-row" id="action-row">
      <button class="btn" style="flex:1" id="btn-valider" onclick="checkAnswer()">VALIDER</button>
      <button class="btn-hint" id="btn-hint" onclick="showNextHint()">💡 INDICE</button>
      <button class="btn-ghost" onclick="skip()">PASSER</button>
    </div>
  </div>
  <div id="history"></div>
</div>

<!-- RÉSULTATS -->
<div id="screen-done" class="screen">
  <div class="card" style="max-width:500px;width:100%">
    <div id="done-emoji" style="font-size:52px"></div>
    <h1 class="big-title" id="done-score"></h1>
    <p class="gold" id="done-pct" style="font-size:12px;letter-spacing:5px;margin-bottom:4px"></p>
    <p class="muted" id="done-label" style="margin-bottom:20px"></p>
    <div id="results-list"></div>
    <div class="btn-row">
      <button class="btn" style="flex:1" onclick="startGame()">REJOUER</button>
      <button class="btn-ghost" style="flex:1" onclick="showScreen('home')">MENU</button>
    </div>
  </div>
</div>

  { flag:"🇨🇭", name:"Suisse",             capital:"Berne",           continent:"Europe",           aliases:["switzerland","bern"] },
  { flag:"🇦🇹", name:"Autriche",           capital:"Vienne",          continent:"Europe",           aliases:["austria","vienna","wien"] },
  { flag:"🇧🇪", name:"Belgique",           capital:"Bruxelles",       continent:"Europe",           aliases:["belgium","brussels","bruxelles"] },
  { flag:"🇸🇪", name:"Suède",             capital:"Stockholm",       continent:"Europe",           aliases:["suede","sweden"] },
  { flag:"🇹🇷", name:"Turquie",            capital:"Ankara",          continent:"Europe / Asie",    aliases:["turkey","turkiye"] },
  { flag:"🇨🇿", name:"Tchéquie",          capital:"Prague",          continent:"Europe",           aliases:["tcheque","tchequie","czech","republique tcheque"] },
  { flag:"🇧🇦", name:"Bosnie-Herzégovine",capital:"Sarajevo",        continent:"Europe",           aliases:["bosnie","bosnie herzegovine","bosnia"] },
  // AFRIQUE (10)
  { flag:"🇲🇦", name:"Maroc",              capital:"Rabat",           continent:"Afrique",          aliases:["morocco"] },
  { flag:"🇹🇳", name:"Tunisie",            capital:"Tunis",           continent:"Afrique",          aliases:["tunisia"] },
  { flag:"🇪🇬", name:"Égypte",            capital:"Le Caire",        continent:"Afrique",          aliases:["egypte","egypt","cairo","caire"] },
  { flag:"🇩🇿", name:"Algérie",           capital:"Alger",           continent:"Afrique",          aliases:["algerie","algeria"] },
  { flag:"🇬🇭", name:"Ghana",              capital:"Accra",           continent:"Afrique",          aliases:[] },
  { flag:"🇨🇻", name:"Cap-Vert",          capital:"Praia",           continent:"Afrique",          aliases:["cap vert","cape verde","cabo verde"] },
  { flag:"🇿🇦", name:"Afrique du Sud",     capital:"Pretoria",        continent:"Afrique",          aliases:["south africa"] },
  { flag:"🇸🇳", name:"Sénégal",           capital:"Dakar",           continent:"Afrique",          aliases:["senegal"] },
  { flag:"🇨🇮", name:"Côte d'Ivoire",    capital:"Yamoussoukro",    continent:"Afrique",          aliases:["cote divoire","ivory coast","cote d ivoire"] },
  { flag:"🇨🇩", name:"RD Congo",           capital:"Kinshasa",        continent:"Afrique",          aliases:["rd congo","rdc","congo","dr congo","republique democratique"] },
  // ASIE (9)
  { flag:"🇯🇵", name:"Japon",              capital:"Tokyo",           continent:"Asie",             aliases:["japan"] },
  { flag:"🇮🇷", name:"Iran",               capital:"Téhéran",         continent:"Asie",             aliases:["tehran"] },
  { flag:"🇺🇿", name:"Ouzbékistan",       capital:"Tachkent",        continent:"Asie",             aliases:["ouzbekistan","uzbekistan","tashkent"] },
  { flag:"🇯🇴", name:"Jordanie",           capital:"Amman",           continent:"Asie",             aliases:["jordan"] },
  { flag:"🇰🇷", name:"Corée du Sud",       capital:"Séoul",           continent:"Asie",             aliases:["coree du sud","south korea","seoul"] },
  { flag:"🇦🇺", name:"Australie",          capital:"Canberra",        continent:"Asie / Océanie",   aliases:["australia"] },
  { flag:"🇶🇦", name:"Qatar",              capital:"Doha",            continent:"Asie",             aliases:[] },
  { flag:"🇸🇦", name:"Arabie Saoudite",    capital:"Riyad",           continent:"Asie",             aliases:["arabie saoudite","saudi arabia","riyadh"] },
  { flag:"🇮🇶", name:"Irak",              capital:"Bagdad",          continent:"Asie",             aliases:["iraq","baghdad"] },
  // CONCACAF (6)
  { flag:"🇺🇸", name:"États-Unis",         capital:"Washington D.C.", continent:"Amérique du Nord", aliases:["usa","etats unis","united states","washington"] },
  { flag:"🇨🇦", name:"Canada",             capital:"Ottawa",          continent:"Amérique du Nord", aliases:[] },
  { flag:"🇲🇽", name:"Mexique",            capital:"Mexico",          continent:"Amérique du Nord", aliases:["mexico city"] },
  { flag:"🇵🇦", name:"Panama",             capital:"Panama City",     continent:"Amérique du Nord", aliases:["panama ciudad"] },
  { flag:"🇭🇹", name:"Haïti",             capital:"Port-au-Prince",  continent:"Amérique du Nord", aliases:["haiti","port au prince"] },
  { flag:"🇨🇼", name:"Curaçao",           capital:"Willemstad",      continent:"Amérique du Nord", aliases:["curacao"] },
  // CONMEBOL (6)
  { flag:"🇦🇷", name:"Argentine",          capital:"Buenos Aires",    continent:"Amérique du Sud",  aliases:["argentina"] },
  { flag:"🇧🇷", name:"Brésil",            capital:"Brasília",        continent:"Amérique du Sud",  aliases:["bresil","brazil","brasil","brasilia"] },
  { flag:"🇺🇾", name:"Uruguay",            capital:"Montevideo",      continent:"Amérique du Sud",  aliases:[] },
  { flag:"🇪🇨", name:"Équateur",          capital:"Quito",           continent:"Amérique du Sud",  aliases:["equateur","ecuador"] },
  { flag:"🇨🇴", name:"Colombie",           capital:"Bogotá",          continent:"Amérique du Sud",  aliases:["colombia","bogota"] },
  { flag:"🇵🇾", name:"Paraguay",           capital:"Asunción",        continent:"Amérique du Sud",  aliases:["asuncion"] },
  // OCÉANIE (1)
  { flag:"🇳🇿", name:"Nouvelle-Zélande",  capital:"Wellington",      continent:"Océanie",          aliases:["nouvelle zelande","new zealand","nz"] },
];

const HINTS = [
  { icon:"🔡", label:"1ère lettre", val: t => `<span class="hint-val">${t.capital[0].toUpperCase()}</span>` },
  { icon:"📏", label:"Longueur",    val: t => `<span class="hint-val">${hintLength(t.capital)}</span>` },
  { icon:"🌍", label:"Continent",   val: t => `<span class="hint-val plain">${t.continent}</span>` },
  { icon:"🔤", label:"Initiales",   val: t => `<span class="hint-val">${hintInitials(t.capital)}</span>` },
  { icon:"🔚", label:"Fin du mot",  val: t => `<span class="hint-val">${hintEnding(t.capital)}</span>` },
];

let queue=[], idx=0, hintLevel=0, score=0, results=[], locked=false;
let selectedCount=12, gameMode='saisie'; // saisie | qcm | mixte
let currentMode='saisie'; // mode effectif pour la question courante

function normalize(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").trim();
}
function shuffle(a) {
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function hintLength(name) {
  return name.split(/[\s\-']+/).map(w=>[...w].map(()=>"﹏").join(" ")).join("  ·  ");
}
function hintInitials(name) {
  return name.split(/[\s\-']+/).map(w=>{const l=[...w];return l[0].toUpperCase()+l.slice(1).map(()=>"_").join("");}).join("-");
}
function hintEnding(name) {
  return name.split(/[\s\-']+/).map(w=>{
    const l=[...w]; if(l.length<=2) return w;
    return l.slice(0,-2).map(()=>"_").join("")+l.slice(-2).join("").toLowerCase();
  }).join("-");
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

function selectMode(m) {
  gameMode = m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('mbtn-'+m).classList.add('selected');
}

document.querySelectorAll('.count-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.count-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedCount=parseInt(btn.dataset.n);
  });
});

function getQcmOptions(correctCapital) {
  const others = shuffle(ALL_TEAMS.filter(t => t.capital !== correctCapital));
  // dédoublonner les capitales
  const seen = new Set([correctCapital]);
  const opts = [];
  for(const t of others) {
    if(!seen.has(t.capital)) { seen.add(t.capital); opts.push(t.capital); }
    if(opts.length === 3) break;
  }
  return shuffle([correctCapital, ...opts]);
}

function startGame() {
  queue = shuffle(ALL_TEAMS).slice(0, selectedCount);
  idx=0; hintLevel=0; score=0; results=[]; locked=false;
  document.getElementById('history').innerHTML='';
  document.getElementById('progress-bar').style.width='0%';
  showScreen('game');
  renderCard();
}

function renderCard() {
  if(idx >= queue.length){ showResults(); return; }
  locked=false; hintLevel=0;

  // Déterminer le mode effectif
  if(gameMode === 'mixte') {
    currentMode = Math.random() < 0.5 ? 'qcm' : 'saisie';
  } else {
    currentMode = gameMode;
  }

  const t = queue[idx];
  const maxScore = queue.length*6;
  document.getElementById('progress-bar').style.width=(idx/queue.length*100)+'%';
  document.getElementById('game-counter').textContent=`${idx+1} / ${queue.length}`;
  document.getElementById('game-score').textContent=`${score} / ${maxScore} pts`;

  const countryEl = document.getElementById('country-display');
  countryEl.className='';
  document.getElementById('q-flag').textContent=t.flag;
  document.getElementById('q-country').textContent=t.name;

  // Dots
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML='';
  for(let i=0;i<HINTS.length;i++){
    const d=document.createElement('div');
    d.className='dot';
    dotsEl.appendChild(d);
  }

  document.getElementById('hints').innerHTML='';
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').style.color='';

  const inputEl = document.getElementById('answer-input');
  const qcmEl = document.getElementById('qcm-grid');
  const btnValider = document.getElementById('btn-valider');
  const btnHint = document.getElementById('btn-hint');
  const actionRow = document.getElementById('action-row');

  actionRow.style.display='';

  if(currentMode === 'qcm') {
    // Mode QCM
    inputEl.style.display='none';
    qcmEl.style.display='grid';
    btnValider.style.display='none';
    btnHint.disabled = (hintLevel >= HINTS.length);

    const opts = getQcmOptions(t.capital);
    qcmEl.innerHTML='';
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className='qcm-opt';
      btn.textContent=opt;
      btn.onclick = () => checkQcm(btn, opt, t.capital);
      qcmEl.appendChild(btn);
    });
  } else {
    // Mode Saisie
    qcmEl.style.display='none';
    inputEl.style.display='';
    inputEl.value=''; inputEl.style.borderColor='';
    btnValider.style.display='';
    btnHint.disabled = (hintLevel >= HINTS.length);
    setTimeout(()=>inputEl.focus(), 50);
  }
}

function showNextHint() {
  if(locked || hintLevel>=HINTS.length) return;
  const t = queue[idx];
  hintLevel++;
  const h = HINTS[hintLevel-1];
  const hintsEl = document.getElementById('hints');
  const box = document.createElement('div');
  box.className='hint-box';
  box.innerHTML=`<span class="hint-icon">${h.icon}</span><span class="hint-label">${h.label}</span>${h.val(t)}`;
  hintsEl.appendChild(box);

  document.getElementById('dots').querySelectorAll('.dot').forEach((d,i)=>{
    d.className='dot'+(i<hintLevel?' used':'');
  });
  document.getElementById('btn-hint').disabled=(hintLevel>=HINTS.length);

  if(currentMode==='qcm') {
    // En QCM avec indice : réduire à 2 choix, dont la bonne réponse
    rebuildQcmWithHint(t.capital);
  } else {
    document.getElementById('answer-input').focus();
  }
}

function rebuildQcmWithHint(correctCapital) {
  const qcmEl = document.getElementById('qcm-grid');
  // Garder la bonne réponse + 1 seul distracteur
  const others = shuffle(ALL_TEAMS.filter(t=>t.capital!==correctCapital));
  const seen = new Set([correctCapital]);
  const distractors = [];
  for(const t of others) {
    if(!seen.has(t.capital)){ seen.add(t.capital); distractors.push(t.capital); }
    if(distractors.length===1) break;
  }
  const opts = shuffle([correctCapital, ...distractors]);
  qcmEl.innerHTML='';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className='qcm-opt';
    btn.textContent=opt;
    btn.onclick = () => checkQcm(btn, opt, correctCapital);
    qcmEl.appendChild(btn);
  });
}

function checkQcm(btn, chosen, correct) {
  if(locked) return;
  locked=true;

  // Désactiver tous les boutons
  document.querySelectorAll('.qcm-opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct) b.classList.add('reveal');
  });

  const fb = document.getElementById('feedback');
  const pts = Math.max(6-hintLevel, 1);
  if(chosen===correct) {
    btn.classList.remove('reveal');
    btn.classList.add('correct');
    fb.style.color='var(--green)';
    fb.textContent=`✓ ${correct} — +${pts} pt${pts>1?'s':''}`;
    document.getElementById('country-display').classList.add('correct');
    advance(pts);
  } else {
    btn.classList.add('wrong');
    fb.style.color='var(--red)';
    fb.textContent=`✗ C'était : ${correct}`;
    document.getElementById('country-display').classList.add('wrong');
    advance(0);
  }
  document.getElementById('action-row').style.display='none';
}

function checkAnswer() {
  if(locked) return;
  const input = document.getElementById('answer-input');
  const val = input.value.trim(); if(!val) return;
  const t = queue[idx];
  const norm = normalize(val);
  const aliases = (t.aliases||[]).map(normalize);
  const isCorrect = norm===normalize(t.capital) || aliases.includes(norm)
    || (normalize(t.capital).startsWith(norm) && norm.length>=4);

  if(isCorrect){
    locked=true;
    const pts = Math.max(6-hintLevel,1);
    const fb = document.getElementById('feedback');
    fb.style.color='var(--green)';
    fb.textContent=`✓ ${t.capital} — +${pts} pt${pts>1?'s':''}`;
    document.getElementById('country-display').classList.add('correct');
    input.style.display='none';
    document.getElementById('action-row').style.display='none';
    advance(pts);
  } else {
    input.value='';
    input.style.borderColor='var(--red)';
    setTimeout(()=>{ input.style.borderColor=''; input.focus(); },500);
  }
}

function skip() {
  if(locked) return;
  locked=true;
  const t = queue[idx];
  const fb = document.getElementById('feedback');
  fb.style.color='var(--red)';
  fb.textContent=`✗ C'était : ${t.capital}`;
  document.getElementById('country-display').classList.add('wrong');
  document.getElementById('answer-input').style.display='none';
  document.getElementById('qcm-grid').querySelectorAll('.qcm-opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===t.capital) b.classList.add('reveal');
  });
  document.getElementById('action-row').style.display='none';
  advance(0);
}

function advance(pts) {
  const t = queue[idx];
  score+=pts;
  results.push({team:t, pts, hintLevel});
  const dot = document.createElement('span');
  dot.title=`${t.name} (${t.capital}) — ${pts} pts`;
  dot.style.fontSize='16px';
  dot.textContent = pts===6?'🟢':pts===0?'🔴':'🟡';
  document.getElementById('history').appendChild(dot);
  document.getElementById('game-score').textContent=`${score} / ${queue.length*6} pts`;
  const next=idx+1;
  setTimeout(()=>{ idx=next; renderCard(); }, 1400);
}

function showResults() {
  document.getElementById('progress-bar').style.width='100%';
  const maxScore=queue.length*6;
  const pct=Math.round(score/maxScore*100);
  const emoji=pct===100?'🏆':pct>=80?'⭐':pct>=50?'💪':'📚';
  const label=pct===100?'PARFAIT !':pct>=80?'EXCELLENT !':pct>=50?'PAS MAL !':'À RETRAVAILLER';
  document.getElementById('done-emoji').textContent=emoji;
  document.getElementById('done-score').textContent=`${score} / ${maxScore}`;
  document.getElementById('done-pct').textContent=pct+'%';
  document.getElementById('done-label').textContent=label;
  const list=document.getElementById('results-list');
  list.innerHTML='';
  results.forEach(r=>{
    const row=document.createElement('div');
    row.className='result-row';
    const bg=r.pts===6?'#0d2b1a':r.pts===0?'#2b0d0d':'#1a1208';
    const col=r.pts===6?'var(--green)':r.pts===0?'var(--red)':'var(--orange)';
    row.style.cssText=`background:${bg};border-left:3px solid ${col}`;
    row.innerHTML=`<span class="result-flag">${r.team.flag}</span>
      <span class="result-name" style="color:${col}">${r.team.name}</span>
      <span class="result-capital">${r.team.capital}</span>
      <span class="result-pts">${r.pts} pt${r.pts!==1?'s':''}</span>`;
    list.appendChild(row);
  });
  showScreen('done');
}

document.getElementById('answer-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') checkAnswer();
});
</script>
</body>
</html>
