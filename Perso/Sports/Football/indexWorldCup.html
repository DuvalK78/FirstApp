<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Le Guide Ultime</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #D4A017;
  --gold-light: #F0C040;
  --red: #C0392B;
  --dark: #0A0A0F;
  --dark2: #12121A;
  --dark3: #1A1A28;
  --card-bg: #15151F;
  --border: rgba(212,160,23,0.2);
  --text: #E8E8F0;
  --muted: #7070A0;
  --accent-blue: #1a6dff;
  --group-colors: #D4A017;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  overflow-x: hidden;
}

/* HERO */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, #1a0a00 0%, var(--dark) 70%);
}

.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 50%, rgba(212,160,23,0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 50%, rgba(192,57,43,0.08) 0%, transparent 50%);
}

.hero-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(212,160,23,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,160,23,0.05) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
}

.hero-content {
  position: relative;
  text-align: center;
  z-index: 2;
}

.flag-strip {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  max-width: 800px;
  margin: 0 auto 40px;
  opacity: 0.6;
  font-size: 28px;
}

.logo-year {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(100px, 20vw, 200px);
  line-height: 0.85;
  letter-spacing: -4px;
  background: linear-gradient(135deg, #F0C040 0%, #D4A017 40%, #8B6010 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 0 60px rgba(212,160,23,0.4));
}

.logo-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(18px, 4vw, 36px);
  font-weight: 300;
  letter-spacing: 12px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 8px;
}

.logo-subtitle {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(12px, 2vw, 16px);
  letter-spacing: 6px;
  color: var(--gold);
  text-transform: uppercase;
  margin-top: 16px;
}

.hero-stats {
  display: flex;
  gap: 60px;
  justify-content: center;
  margin-top: 60px;
  flex-wrap: wrap;
}

.hero-stat {
  text-align: center;
}

.hero-stat .num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 48px;
  color: var(--gold);
  line-height: 1;
}

.hero-stat .label {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}

.scroll-hint {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  animation: bounce 2s infinite;
}

.scroll-hint::after {
  content: '';
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, var(--gold), transparent);
}

@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* NAV */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,15,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.nav-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
}

.nav-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: var(--gold);
  letter-spacing: 2px;
}

.nav-tabs {
  display: flex;
  gap: 4px;
}

.nav-tab {
  padding: 6px 16px;
  border: none;
  background: none;
  color: var(--muted);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
}

.nav-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.nav-tab.active { color: var(--gold); background: rgba(212,160,23,0.1); }

/* SEARCH */
.search-bar {
  padding: 40px 24px 24px;
  max-width: 1400px;
  margin: 0 auto;
}

.search-input-wrap {
  position: relative;
  max-width: 500px;
}

.search-input {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 20px 12px 44px;
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus { border-color: var(--gold); }

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 18px;
}

.filter-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.pill {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--muted);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}

.pill:hover, .pill.active { border-color: var(--gold); color: var(--gold); background: rgba(212,160,23,0.08); }

/* MAIN CONTENT */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* SECTION TITLE */
.section-header {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin-bottom: 32px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 48px;
  letter-spacing: 2px;
  color: var(--text);
}

.section-count {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  color: var(--muted);
  letter-spacing: 2px;
}

/* GROUP VIEW */
.groups-view { display: none; }
.groups-view.active { display: block; }

.group-block {
  margin-bottom: 48px;
}

.group-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  color: var(--gold);
  opacity: 0.15;
  line-height: 1;
  position: absolute;
  right: 0;
  top: -10px;
  letter-spacing: -2px;
}

.group-header {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}

.group-badge {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--gold), #8B6010);
  border-radius: 8px;
  color: #000;
  letter-spacing: 1px;
}

.group-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text);
}

.group-teams-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

/* TEAM CARD */
.team-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}

.team-card:hover {
  border-color: var(--gold);
  transform: translateY(-4px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,160,23,0.3);
}

.team-card-banner {
  height: 6px;
  background: linear-gradient(90deg, var(--gold), transparent);
}

.team-card-body {
  padding: 20px;
}

.team-flag-name {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.team-flag-emoji {
  font-size: 40px;
  line-height: 1;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
}

.team-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text);
  line-height: 1.1;
}

.team-confederation {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 2px;
}

.team-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}

.team-meta-item {
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  padding: 8px 10px;
}

.team-meta-label {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 2px;
}

.team-meta-value {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.team-matches {
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 12px;
}

.match-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 12px;
  color: var(--muted);
}

.match-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  flex-shrink: 0;
}

.match-date {
  color: var(--gold-light);
  font-weight: 600;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
}

.btn-detail {
  display: block;
  width: 100%;
  margin-top: 16px;
  padding: 10px;
  background: rgba(212,160,23,0.08);
  border: 1px solid rgba(212,160,23,0.2);
  border-radius: 6px;
  color: var(--gold);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-detail:hover {
  background: rgba(212,160,23,0.2);
  border-color: var(--gold);
}

/* GRID VIEW */
.grid-view { display: none; }
.grid-view.active { display: block; }

.all-teams-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(10px);
  z-index: 1000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  overflow-y: auto;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: 20px;
  width: 100%;
  max-width: 800px;
  position: relative;
  overflow: hidden;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-hero {
  position: relative;
  height: 200px;
  background: linear-gradient(135deg, var(--dark3), var(--dark2));
  display: flex;
  align-items: flex-end;
  padding: 32px;
  overflow: hidden;
}

.modal-hero-bg {
  position: absolute;
  inset: 0;
  opacity: 0.15;
  font-size: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  overflow: hidden;
}

.modal-hero-flag {
  font-size: 80px;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.8));
  position: relative;
  z-index: 1;
}

.modal-hero-info {
  position: relative;
  z-index: 1;
  margin-left: 24px;
}

.modal-country-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 48px;
  line-height: 1;
  color: var(--text);
}

.modal-group-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--gold);
  color: #000;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 4px 12px;
  border-radius: 20px;
  margin-top: 8px;
  text-transform: uppercase;
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: background 0.2s;
}

.modal-close:hover { background: rgba(255,255,255,0.2); }

.modal-body {
  padding: 32px;
}

.modal-sections {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 32px;
}

.modal-section h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.info-grid {
  display: grid;
  gap: 8px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
}

.info-row .key {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.info-row .val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  text-align: right;
  max-width: 60%;
}

/* MINI MAP */
.mini-map {
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  overflow: hidden;
  height: 140px;
  position: relative;
}

.mini-map iframe {
  width: 100%;
  height: 100%;
  border: none;
  filter: grayscale(80%) brightness(0.6) contrast(1.2);
}

.mini-map-label {
  position: absolute;
  bottom: 8px;
  left: 8px;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--gold);
  text-transform: uppercase;
  background: rgba(0,0,0,0.7);
  padding: 2px 6px;
  border-radius: 3px;
}

/* PLAYERS LIST */
.players-full {
  margin-top: 24px;
}

.players-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.player-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  border: 1px solid transparent;
  transition: border-color 0.2s;
}

.player-item:hover { border-color: var(--border); }

.player-number {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  color: var(--gold);
  width: 22px;
  text-align: center;
  flex-shrink: 0;
}

.player-info .name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.player-info .pos {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* MATCHES */
.matches-list {
  display: grid;
  gap: 8px;
}

.match-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  border: 1px solid transparent;
}

.match-card:hover { border-color: var(--border); }

.match-teams {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 600;
}

.match-vs {
  color: var(--gold);
  margin: 0 8px;
}

.match-datetime {
  text-align: right;
}

.match-datetime .date {
  font-size: 13px;
  color: var(--gold-light);
  font-weight: 600;
}

.match-datetime .venue {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

/* JERSEY DISPLAY */
.jersey-row {
  display: flex;
  gap: 16px;
  margin-top: 24px;
}

.jersey-card {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  padding: 20px;
  text-align: center;
}

.jersey-svg {
  display: block;
  margin: 0 auto 12px;
}

.jersey-label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* FOOTER */
.footer {
  background: var(--dark2);
  border-top: 1px solid var(--border);
  padding: 40px 24px;
  text-align: center;
}

.footer-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  color: var(--gold);
  letter-spacing: 3px;
}

.footer-copy {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
  letter-spacing: 1px;
}

/* RESPONSIVE */
@media (max-width: 1100px) {
  .group-teams-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 768px) {
  .group-teams-grid { grid-template-columns: 1fr; }
  .modal-sections { grid-template-columns: 1fr; }
  .players-grid { grid-template-columns: repeat(2, 1fr); }
  .hero-stats { gap: 30px; }
}

@media (max-width: 540px) {
  .nav-tabs { display: none; }
  .players-grid { grid-template-columns: 1fr; }
}

/* ANIMATIONS */
.team-card {
  animation: fadeInUp 0.4s ease backwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.hidden { display: none !important; }

/* JERSEY SVG DESIGNS */
.jersey { transition: transform 0.3s; }
.jersey:hover { transform: scale(1.05); }
</style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-grid"></div>
  <div class="hero-content">
    <div class="flag-strip" id="flagStrip"></div>
    <div class="logo-year">2026</div>
    <div class="logo-title">Coupe du Monde FIFA</div>
    <div class="logo-subtitle">Canada · États-Unis · Mexique · 11 Juin — 19 Juillet</div>
    <div class="hero-stats">
      <div class="hero-stat"><div class="num">48</div><div class="label">Nations</div></div>
      <div class="hero-stat"><div class="num">12</div><div class="label">Groupes</div></div>
      <div class="hero-stat"><div class="num">104</div><div class="label">Matchs</div></div>
      <div class="hero-stat"><div class="num">16</div><div class="label">Stades</div></div>
    </div>
  </div>
  <div class="scroll-hint">Découvrir</div>
</section>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">WC2026</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchView('groups', this)">Par Groupes</button>
      <button class="nav-tab" onclick="switchView('grid', this)">Toutes les Équipes</button>
    </div>
  </div>
</nav>

<!-- SEARCH -->
<div class="search-bar">
  <div class="search-input-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" placeholder="Rechercher une équipe ou un joueur..." oninput="filterTeams(this.value)" id="searchInput">
  </div>
  <div class="filter-pills" id="confPills">
    <button class="pill active" onclick="filterConf('all', this)">Toutes</button>
    <button class="pill" onclick="filterConf('UEFA', this)">Europe</button>
    <button class="pill" onclick="filterConf('CAF', this)">Afrique</button>
    <button class="pill" onclick="filterConf('AFC', this)">Asie</button>
    <button class="pill" onclick="filterConf('CONCACAF', this)">CONCACAF</button>
    <button class="pill" onclick="filterConf('CONMEBOL', this)">Amérique du Sud</button>
    <button class="pill" onclick="filterConf('OFC', this)">Océanie</button>
  </div>
</div>

<!-- MAIN -->
<main class="main">

  <!-- GROUPS VIEW -->

// =========================================================
// JERSEY SVG GENERATOR
// =========================================================
function jerseysSVG(colors, label) {
  const [c1, c2] = colors;
  return `<svg class="jersey" width="80" height="90" viewBox="0 0 80 90" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 10 L5 25 L15 30 L15 85 L65 85 L65 30 L75 25 L60 10 C57 18 50 22 40 22 C30 22 23 18 20 10Z" fill="${c1}" stroke="${c2}" stroke-width="2"/>
    <path d="M5 25 L15 30 L15 55 L5 50Z" fill="${c2}"/>
    <path d="M75 25 L65 30 L65 55 L75 50Z" fill="${c2}"/>
  </svg>`;
}

// =========================================================
// RENDER FUNCTIONS
// =========================================================
let currentConf = 'all';
let searchQuery = '';
let currentView = 'groups';

const groups = ['A','B','C','D','E','F','G','H','I','J','K','L'];

function getTeamsFiltered() {
  return TEAMS.filter(t => {
    const matchConf = currentConf === 'all' || t.conf === currentConf;
    const matchSearch = !searchQuery ||
      t.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
      t.capital.toLowerCase().includes(searchQuery.toLowerCase()) ||
      t.players.some(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
    return matchConf && matchSearch;
  });
}

function renderTeamCard(team, delay = 0) {
  const mapUrl = `https://www.openstreetmap.org/export/embed.html?bbox=${team.coords[1]-10},${team.coords[0]-8},${team.coords[1]+10},${team.coords[0]+8}&layer=mapnik&marker=${team.coords[0]},${team.coords[1]}`;
  const stars = team.host ? '<span style="color:var(--gold);font-size:10px;letter-spacing:2px;"> ★ HÔTE</span>' : '';
  const topPlayers = team.players.slice(0, 3).map(p => `${p.name} (${p.pos})`).join(', ');
  return `
  <div class="team-card" onclick="openModal('${team.code}')" style="animation-delay:${delay}ms" data-team="${team.code}">
    <div class="team-card-banner"></div>
    <div class="team-card-body">
      <div class="team-flag-name">
        <div class="team-flag-emoji">${team.flag}</div>
        <div>
          <div class="team-name">${team.name}${stars}</div>
          <div class="team-confederation">${confLabel(team.conf)} · FIFA #${team.fifa}</div>
        </div>
      </div>
      <div class="team-meta">
        <div class="team-meta-item">
          <div class="team-meta-label">Capitale</div>
          <div class="team-meta-value">${team.capital}</div>
        </div>
        <div class="team-meta-item">
          <div class="team-meta-label">Groupe</div>
          <div class="team-meta-value" style="color:var(--gold)">Groupe ${team.group}</div>
        </div>
        <div class="team-meta-item">
          <div class="team-meta-label">Population</div>
          <div class="team-meta-value">${team.pop}</div>
        </div>
        <div class="team-meta-item">
          <div class="team-meta-label">Joueurs</div>
          <div class="team-meta-value">${team.players.length} appelés</div>
        </div>
      </div>
      <div class="team-matches">
        ${team.matches.slice(0,2).map(m => `
          <div class="match-row">
            <div class="match-dot"></div>
            <span class="match-date">${m.date}</span>
            <span style="margin-left:4px">vs ${m.opp}</span>
          </div>
        `).join('')}
      </div>
      <button class="btn-detail">Voir l'équipe →</button>
    </div>
  </div>`;
}

function confLabel(conf) {
  const labels = {UEFA:'Europe',CAF:'Afrique',AFC:'Asie',CONCACAF:'CONCACAF',CONMEBOL:'Am. du Sud',OFC:'Océanie'};
  return labels[conf] || conf;
}

function renderGroupsView() {
  const container = document.getElementById('groupsView');
  const filtered = getTeamsFiltered();
  let html = '';
  groups.forEach(g => {
    const groupTeams = filtered.filter(t => t.group === g);
    if (!groupTeams.length) return;
    html += `
    <div class="group-block">
      <div class="group-header">
        <div class="group-badge">${g}</div>
        <div class="group-name">Groupe ${g}</div>
        <div style="margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:2px">${groupTeams.length} équipe${groupTeams.length>1?'s':''}</div>
      </div>
      <div class="group-teams-grid">
        ${groupTeams.map((t,i) => renderTeamCard(t, i * 80)).join('')}
      </div>
    </div>`;
  });
  container.innerHTML = html || '<div style="text-align:center;color:var(--muted);padding:60px;font-size:18px">Aucune équipe trouvée</div>';
}

function renderGridView() {
  const container = document.getElementById('allTeamsGrid');
  const count = document.getElementById('teamCount');
  const filtered = getTeamsFiltered();
  count.textContent = `${filtered.length} équipe${filtered.length > 1 ? 's' : ''}`;
  container.innerHTML = filtered.map((t,i) => renderTeamCard(t, i * 30)).join('');
}

function switchView(view, btn) {
  currentView = view;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('groupsView').classList.toggle('active', view === 'groups');
  document.getElementById('gridView').classList.toggle('active', view === 'grid');
  if (view === 'groups') renderGroupsView();
  else renderGridView();
}

function filterConf(conf, btn) {
  currentConf = conf;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  rerender();
}

function filterTeams(q) {
  searchQuery = q;
  rerender();
}

function rerender() {
  if (currentView === 'groups') renderGroupsView();
  else renderGridView();
}

// =========================================================
// MODAL
// =========================================================
function openModal(code) {
  const team = TEAMS.find(t => t.code === code);
  if (!team) return;

  const mapUrl = `https://www.openstreetmap.org/export/embed.html?bbox=${team.coords[1]-15},${team.coords[0]-10},${team.coords[1]+15},${team.coords[0]+10}&layer=mapnik&marker=${team.coords[0]},${team.coords[1]}`;

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-hero">
      <div class="modal-hero-bg">${team.flag}</div>
      <div class="modal-hero-flag">${team.flag}</div>
      <div class="modal-hero-info">
        <div class="modal-country-name">${team.name}</div>
        <div class="modal-group-badge">⚽ Groupe ${team.group} · ${confLabel(team.conf)}</div>
        ${team.host ? '<div style="margin-top:6px;font-size:12px;color:var(--gold);letter-spacing:2px">★ PAYS HÔTE</div>' : ''}
      </div>
    </div>
    <div class="modal-body">

      <div class="modal-sections">
        <div class="modal-section">
          <h3>Informations pays</h3>
          <div class="info-grid">
            <div class="info-row"><span class="key">Capitale</span><span class="val">${team.capital}</span></div>
            <div class="info-row"><span class="key">Population</span><span class="val">${team.pop}</span></div>
            <div class="info-row"><span class="key">Confédération</span><span class="val">${confLabel(team.conf)}</span></div>
            <div class="info-row"><span class="key">Classement FIFA</span><span class="val" style="color:var(--gold)">#${team.fifa}</span></div>
          </div>
        </div>
        <div class="modal-section">
          <h3>Localisation</h3>
          <div class="mini-map">
            <iframe src="${mapUrl}" allowfullscreen loading="lazy"></iframe>
            <div class="mini-map-label">📍 ${team.capital}</div>
          </div>
        </div>
      </div>

      <div class="modal-section" style="margin-bottom:24px">
        <h3>Maillots</h3>
        <div class="jersey-row">
          <div class="jersey-card">
            ${jerseysSVG(team.jersey.home, 'Domicile')}
            <div class="jersey-label">Domicile</div>
          </div>
          <div class="jersey-card">
            ${jerseysSVG(team.jersey.away, 'Extérieur')}
            <div class="jersey-label">Extérieur</div>
          </div>
        </div>
      </div>

      <div class="modal-section" style="margin-bottom:24px">
        <h3>Calendrier de phase de groupes</h3>
        <div class="matches-list">
          ${team.matches.map(m => `
            <div class="match-card">
              <div class="match-teams">
                ${team.flag} <span>${team.name}</span>
                <span class="match-vs">vs</span>
                <span>${m.opp}</span>
              </div>
              <div class="match-datetime">
                <div class="date">📅 ${m.date} 2026</div>
                <div class="venue">📍 ${m.venue}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="modal-section players-full">
        <h3>Sélection — ${team.players.length} joueurs appelés</h3>
        <div class="players-grid">
          ${team.players.map(p => `
            <div class="player-item">
              <div class="player-number">${p.n}</div>
              <div class="player-info">
                <div class="name">${p.name}</div>
                <div class="pos">${posLabel(p.pos)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

    </div>
  `;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function posLabel(pos) {
  const l = {GK:'Gardien',DEF:'Défenseur',MID:'Milieu',FWD:'Attaquant'};
  return l[pos] || pos;
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
}

function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// =========================================================
// FLAG STRIP
// =========================================================
const strip = document.getElementById('flagStrip');
TEAMS.slice(0, 24).forEach(t => {
  const span = document.createElement('span');
  span.textContent = t.flag;
  strip.appendChild(span);
});

// =========================================================
// INIT
// =========================================================
renderGroupsView();
renderGridView();

// ESC to close modal
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalBtn(); });
</script>
