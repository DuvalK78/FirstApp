
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .wec-root {
    background: #00085C;
    min-height: 420px;
    padding: 2rem 1rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-radius: var(--border-radius-lg);
    position: relative;
    overflow: hidden;
  }
  .track-lines {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .track-line {
    position: absolute; height: 1px; background: rgba(255,255,255,0.06); width: 100%;
  }
  .wec-logo {
    display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem;
  }
  .wec-badge {
    background: #00B4FF; border-radius: 4px; padding: 4px 10px;
    font-size: 11px; font-weight: 500; color: #00085C; letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .wec-title {
    font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase;
  }
  .counter {
    font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 1px; margin-bottom: 1.2rem;
  }
  .carousel-area {
    display: flex; align-items: center; gap: 16px; width: 100%; max-width: 600px;
    margin-bottom: 1.5rem;
  }
  .arrow-btn {
    background: rgba(255,255,255,0.07); border: 0.5px solid rgba(255,255,255,0.15);
    border-radius: 50%; width: 44px; height: 44px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 18px; transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  .arrow-btn:hover { background: rgba(0,180,255,0.2); transform: scale(1.1); }
  .arrow-btn:active { transform: scale(0.95); }
  .card-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .team-card {
    width: 100%; background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(0,180,255,0.3);
    border-radius: var(--border-radius-lg);
    padding: 1.5rem 1.25rem;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.15s;
    text-decoration: none;
    animation: fadeSlide 0.3s ease;
  }
  .team-card:hover { background: rgba(0,180,255,0.12); border-color: #00B4FF; transform: translateY(-2px); }
  .team-logo-circle {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 500; color: #00B4FF; letter-spacing: -1px;
  }
  .team-name {
    font-size: 18px; font-weight: 500; color: #fff; text-align: center; line-height: 1.3;
  }
  .team-class-badge {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 10px;
    border-radius: 20px; font-weight: 500;
  }
  .badge-hyper { background: rgba(0,180,255,0.15); color: #00B4FF; border: 0.5px solid rgba(0,180,255,0.4); }
  .badge-lmgt3 { background: rgba(255,160,0,0.15); color: #FFA000; border: 0.5px solid rgba(255,160,0,0.4); }
  .visit-link {
    font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.5px;
  }
  .dots { display: flex; gap: 6px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2);
    transition: background 0.2s, transform 0.2s; cursor: pointer;
  }
  .dot.active { background: #00B4FF; transform: scale(1.3); }
  .footer-link {
    margin-top: 0.75rem; font-size: 11px; color: rgba(255,255,255,0.25);
    text-decoration: none; letter-spacing: 0.5px;
  }
  .footer-link:hover { color: #00B4FF; }
</style>

<div class="wec-root">
  <div class="track-lines" id="trackLines"></div>

  <div class="wec-logo">
    <span class="wec-badge">FIA WEC</span>
    <span class="wec-title">2025 Season</span>
  </div>

  <p class="counter" id="counter">1 / 10</p>

  <div class="carousel-area">
    <button class="arrow-btn" id="prev">&#8592;</button>
    <div class="card-wrap">
      <a class="team-card" id="teamCard" href="#">
        <div class="team-logo-circle" id="teamInitials">TGR</div>
        <span class="team-name" id="teamName">Toyota Gazoo Racing</span>
        <span class="team-class-badge badge-hyper" id="teamBadge">Hypercar</span>
        <span class="visit-link">Voir la page équipe →</span>
      </a>
    </div>
    <button class="arrow-btn" id="next">&#8594;</button>
  </div>

  <div class="dots" id="dots"></div>
  <a class="footer-link" href="https://www.fiawec.com" target="_blank">fiawec.com</a>
</div>

<script>
const teams = [
  { name: "AF Corse", link: "../WEC_Teams/AF_Corse.html", cls: "LMGT3", badge: "badge-lmgt3" },
  { name: "Alpine Endurance Team", link: "../WEC_Teams/Alpine_Endurance_Team.html", cls: "Hypercar", badge: "badge-hyper" },
  { name: "Aston Martin", link: "../WEC_Teams/Aston_Martin.html", cls: "Hypercar", badge: "badge-hyper" },
  { name: "BMW M Team WRT", link: "../WEC_Teams/BMW_M_Team_WRT.html", cls: "Hypercar", badge: "badge-hyper" },
  { name: "Cadillac Racing", link: "../WEC_Teams/Cadillac_Racing.html", cls: "Hypercar", badge: "badge-hyper" },
  { name: "Ferrari AF Corse", link: "../WEC_Teams/Ferrari_AF_Corse.html", cls: "Hypercar", badge: "badge-hyper" },
  { name: "Peugeot TotalEnergies", link: "../WEC_Teams/Peugeot_TotalEnergies.html", cls: "Hypercar", badge: "badge-hyper" },
  { name: "Porsche Penske Motorsport", link: "../WEC_Teams/Porsche_Penske_Motorsport.html", cls: "Hypercar", badge: "badge-hyper" },
  { name: "Proton Competition", link: "../WEC_Teams/Proton_Competition.html", cls: "LMGT3", badge: "badge-lmgt3" },
  { name: "Toyota Gazoo Racing", link: "../WEC_Teams/Toyota_Gazoo_Racing.html", cls: "Hypercar", badge: "badge-hyper" }
];

let idx = 0;
const card = document.getElementById("teamCard");
const nameEl = document.getElementById("teamName");
const initialsEl = document.getElementById("teamInitials");
const badgeEl = document.getElementById("teamBadge");
const counter = document.getElementById("counter");
const dotsEl = document.getElementById("dots");
const lines = document.getElementById("trackLines");

for (let i = 0; i < 8; i++) {
  const l = document.createElement("div");
  l.className = "track-line";
  l.style.top = (10 + i * 12) + "%";
  lines.appendChild(l);
}

teams.forEach((_, i) => {
  const d = document.createElement("div");
  d.className = "dot" + (i === 0 ? " active" : "");
  d.addEventListener("click", () => { idx = i; update(); });
  dotsEl.appendChild(d);
});

function initials(name) {
  return name.split(" ").filter(w => /[A-Z]/.test(w[0])).slice(0,3).map(w => w[0]).join("");
}

function update(dir) {
  const t = teams[idx];
  nameEl.textContent = t.name;
  card.href = t.link;
  initialsEl.textContent = initials(t.name);
  badgeEl.textContent = t.cls;
  badgeEl.className = "team-class-badge " + t.badge;
  counter.textContent = (idx + 1) + " / " + teams.length;
  document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("active", i === idx));
  card.style.animation = "none";
  void card.offsetWidth;
  card.style.animation = "fadeSlide 0.3s ease";
}

document.getElementById("prev").addEventListener("click", () => { idx = (idx - 1 + teams.length) % teams.length; update(); });
document.getElementById("next").addEventListener("click", () => { idx = (idx + 1) % teams.length; update(); });

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { idx = (idx - 1 + teams.length) % teams.length; update(); }
  if (e.key === "ArrowRight") { idx = (idx + 1) % teams.length; update(); }
});

update();
</script>
