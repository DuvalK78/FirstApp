<html lang="fr">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #03030d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    #wec-universe {
      position: relative; overflow: hidden; min-height: 580px; width: 100%; max-width: 700px;
      background: #03030d;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 1rem 2rem;
    }
    canvas#bg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

    .wec-header {
      position: relative; z-index: 2; text-align: center; margin-bottom: 1.5rem; padding-top: 1.8rem;
    }
    .wec-header .big-title {
      font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: 5px; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 6px;
    }
    .wec-header .championship {
      font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 900;
      color: #fff; letter-spacing: 2px;
      text-shadow: 0 0 30px var(--team-glow, #00f0ff), 0 0 60px var(--team-glow, #00f0ff44);
      transition: text-shadow 0.6s ease;
    }
    .wec-header .season-badge {
      display: inline-block; margin-top: 8px; padding: 3px 14px;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
      font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.4); text-transform: uppercase;
    }

    .track-visual {
      position: relative; z-index: 2; width: 100%; max-width: 620px;
      display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 1.2rem;
    }
    .arrow-zone { width: 64px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
    .arr-btn {
      width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.04);
      color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; font-family: 'Orbitron', monospace;
    }
    .arr-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.5); transform: scale(1.1); }
    .arr-btn:active { transform: scale(0.93); }

    .card-stage { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0; }
    .car-silhouette {
      width: 240px; height: 80px; margin-bottom: 8px; position: relative;
      filter: drop-shadow(0 0 16px var(--team-glow, #00f0ff));
      transition: filter 0.6s ease;
    }
    .car-silhouette svg { width: 100%; height: 100%; }

    .main-card {
      width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden;
      position: relative; cursor: pointer; transition: transform 0.2s; display: block; text-decoration: none;
    }
    .main-card:hover { transform: scale(1.02) translateY(-3px); }
    .card-border {
      position: absolute; inset: 0; border-radius: 12px;
      border: 1.5px solid transparent;
      background: linear-gradient(var(--team-color1, #00f0ff), var(--team-color2, #ff2e63)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out; mask-composite: exclude;
      transition: all 0.6s; pointer-events: none;
    }
    .card-inner {
      background: rgba(5,5,20,0.9); backdrop-filter: blur(8px);
      padding: 1.5rem 1.5rem 1.2rem;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .team-number {
      font-family: 'Orbitron', monospace; font-size: 48px; font-weight: 900; line-height: 1;
      color: transparent;
      background: linear-gradient(135deg, var(--team-color1, #00f0ff), var(--team-color2, #ff2e63));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      opacity: 0.25; position: absolute; top: 10px; right: 18px; transition: all 0.6s;
    }
    .team-name-display {
      font-family: 'Orbitron', monospace; font-size: 17px; font-weight: 700;
      color: #fff; text-align: center; line-height: 1.3; transition: all 0.3s;
    }
    .badges-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .badge {
      font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
      font-weight: 600; padding: 4px 12px; border-radius: 20px;
    }
    .badge-hyper {
      background: linear-gradient(90deg, rgba(0,240,255,0.15), rgba(0,240,255,0.05));
      border: 1px solid rgba(0,240,255,0.4); color: #00f0ff;
    }
    .badge-lmgt3 {
      background: linear-gradient(90deg, rgba(255,160,0,0.15), rgba(255,160,0,0.05));
      border: 1px solid rgba(255,160,0,0.4); color: #ffa000;
    }
    .badge-car { border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.45); background: transparent; }
    .visit-hint { font-size: 10px; color: rgba(255,255,255,0.25); letter-spacing: 1px; }

    .progress-bar-wrap { position: relative; z-index: 2; width: 100%; max-width: 400px; margin-bottom: 1rem; }
    .progress-track { height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    .progress-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--team-color1, #00f0ff), var(--team-color2, #ff2e63));
      transition: width 0.5s ease, background 0.6s ease;
    }

    .dots-row { position: relative; z-index: 2; display: flex; gap: 7px; margin-bottom: 0.8rem; }
    .dot {
      width: 5px; height: 5px; border-radius: 50%; cursor: pointer;
      background: rgba(255,255,255,0.15); transition: all 0.25s;
    }
    .dot.on {
      background: var(--team-color1, #00f0ff);
      box-shadow: 0 0 8px var(--team-color1, #00f0ff);
      transform: scale(1.5);
    }

    .bottom-links {
      position: relative; z-index: 2; display: flex; flex-direction: column;
      align-items: center; gap: 8px; margin-top: 0.5rem;
    }
    .back-lnk {
      font-size: 11px; color: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      padding: 6px 18px; text-decoration: none; letter-spacing: 1px;
      transition: all 0.2s; font-family: 'Inter', sans-serif;
    }
    .back-lnk:hover { color: #fff; border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.06); }
    .official-lnk {
      font-size: 10px; color: rgba(255,255,255,0.2); text-decoration: none;
      letter-spacing: 1px; transition: color 0.2s;
    }
    .official-lnk:hover { color: rgba(255,255,255,0.55); }

    @keyframes cardIn { from { opacity:0; transform:translateY(14px) scale(0.97); } to { opacity:1; transform:none; } }
    @keyframes carIn  { from { opacity:0; transform:translateX(-20px); }           to { opacity:1; transform:none; } }
    .anim-card { animation: cardIn 0.35s ease forwards; }
    .anim-car  { animation: carIn  0.4s  ease forwards; }
  </style>
</head>

  dotsRow.appendChild(d);
});

  teamNameEl.textContent = t.name;
  teamNum.textContent = t.num;
  teamNum.style.background = `linear-gradient(135deg, ${t.c1}, ${t.c2})`;
  teamNum.style.webkitBackgroundClip = 'text';
  teamNum.style.webkitTextFillColor = 'transparent';

  cardBorder.style.background = `linear-gradient(${t.c1}, ${t.c2}) border-box`;

  badgesRow.innerHTML = '';
  const b1 = document.createElement('span');
  b1.className = 'badge ' + (t.cls === 'Hypercar' ? 'badge-hyper' : 'badge-lmgt3');
  b1.textContent = t.cls;
  const b2 = document.createElement('span');
  b2.className = 'badge badge-car';
  b2.textContent = t.car;
  badgesRow.appendChild(b1);
  badgesRow.appendChild(b2);

  mainCard.href = t.link;
  mainCard.classList.remove('anim-card'); void mainCard.offsetWidth; mainCard.classList.add('anim-card');

  progFill.style.width = ((idx + 1) / teams.length * 100) + '%';
  progFill.style.background = `linear-gradient(90deg, ${t.c1}, ${t.c2})`;

  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === idx));

  updateParticles(t.c1, t.c2);
}

document.getElementById('prev').addEventListener('click', () => { idx = (idx - 1 + teams.length) % teams.length; render(); });
document.getElementById('next').addEventListener('click', () => { idx = (idx + 1) % teams.length; render(); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  { idx = (idx - 1 + teams.length) % teams.length; render(); }
  if (e.key === 'ArrowRight') { idx = (idx + 1) % teams.length; render(); }
});

// ── Canvas particle system ──────────────────────────────────────────
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');
let particles = [], c1 = '#00f0ff', c2 = '#ff2e63';

function resizeCanvas() { canvas.width = root.offsetWidth; canvas.height = root.offsetHeight; }
resizeCanvas();

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 10;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = -(0.5 + Math.random() * 1.5);
    this.r = 0.5 + Math.random() * 2;
    this.life = 1;
    this.decay = 0.004 + Math.random() * 0.008;
    this.col = Math.random() > 0.5 ? c1 : c2;
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.life -= this.decay;
    if (this.life <= 0 || this.y < -10) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.life * 0.7;
    ctx.fillStyle = this.col;
    ctx.shadowColor = this.col;
    ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

for (let i = 0; i < 90; i++) {
  const p = new Particle();
  p.y = Math.random() * canvas.height;
  p.life = Math.random();
  particles.push(p);
}

function drawTrackLines() {
  ctx.save();
  for (let i = 0; i < 5; i++) {
    const y = canvas.height * (0.15 + i * 0.18);
    const grad = ctx.createLinearGradient(0, y, canvas.width, y);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.3, c1 + '22');
    grad.addColorStop(0.7, c2 + '22');
    grad.addColorStop(1, 'transparent');
    ctx.strokeStyle = grad; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
  ctx.restore();
}

(function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawTrackLines();
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(loop);
})();

function updateParticles(nc1, nc2) { c1 = nc1; c2 = nc2; }

new ResizeObserver(() => { resizeCanvas(); }).observe(root);

render();
</script>
