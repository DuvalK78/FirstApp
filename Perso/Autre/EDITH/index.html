<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUD EDITH - Pixel Perfect Replica</title>
  <style>
    :root {
      --blue: #6d83ff;
      --blue-glow: rgba(109, 131, 255, 0.7);
      --cyan: #a8bcff;
      --red: #ff2a55;
      --red-glow: rgba(255, 42, 85, 0.8);
      --bg-hud: rgba(6, 12, 28, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; user-select: none; }

    body {
      background-color: #020409;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at center 60%, rgba(109, 131, 255, 0.1) 0%, transparent 70%);
    }

    /* CONTENEUR GLOBAL DU SCÉNARIO HUD (PLEIN ÉCRAN VIRTUEL) */
    .hud-viewport {
      position: relative;
      width: 1100px;
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================
       1. BLOC BLEU PRINCIPAL CENTRAL
       ========================================================= */
    .main-blue-block {
      position: relative;
      width: 580px;
      height: 250px;
      filter: drop-shadow(0 0 10px var(--blue-glow));
      z-index: 10;
    }

    /* Cadre Hexagonal Externe avec Découpes d'angles */
    .outer-chassis {
      position: absolute;
      inset: 0;
      border: 1.5px solid var(--blue);
      clip-path: polygon(
        0% 28%, 6% 0%, 94% 0%, 100% 28%,
        100% 72%, 94% 100%, 6% 100%, 0% 72%
      );
      background: rgba(4, 9, 24, 0.65);
      backdrop-filter: blur(3px);
    }

    .outer-chassis::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(var(--blue) 1px, transparent 0);
      background-size: 5px 5px;
      opacity: 0.15;
    }

    /* Textes et Identifiants du Châssis Externe */
    .lbl-edith {
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      font-size: 1.1rem; font-weight: 900; letter-spacing: 7px; color: #fff;
      text-shadow: 0 0 10px var(--blue); z-index: 12;
    }
    .lbl-stark-top {
      position: absolute; top: 1px; left: 50%; transform: translateX(-50%);
      font-size: 0.35rem; letter-spacing: 3px; color: var(--cyan); opacity: 0.8; z-index: 12;
    }
    .lbl-b7a-top { position: absolute; top: 10px; left: 45px; font-size: 0.55rem; color: #fff; font-weight: bold; }
    .lbl-v57t-top { position: absolute; top: 10px; right: 45px; font-size: 0.55rem; color: var(--cyan); }

    .lbl-v5vb-bot { position: absolute; bottom: 10px; left: 55px; font-size: 0.55rem; color: #fff; font-weight: bold; }
    .lbl-b7a-bot { position: absolute; bottom: 10px; right: 55px; font-size: 0.55rem; color: #fff; font-weight: bold; }
    .lbl-stark-bot {
      position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
      font-size: 0.35rem; letter-spacing: 3px; color: var(--cyan); opacity: 0.8;
    }

    /* CONTENEUR DES 3 SOUS-MODULES INTERNES */
    .sub-modules {
      position: absolute;
      top: 32px; bottom: 28px; left: 28px; right: 28px;
      display: flex; gap: 6px; z-index: 11;
    }

    /* FORMES DE MODULES AVEC ENCOCHES ARQUÉES EXACTES */
    .mod-frame {
      background: var(--bg-hud);
      border: 1.5px solid var(--blue);
      position: relative;
    }

    /* Module Gauche : Données Grid */
    .mod-left {
      flex: 1;
      border-radius: 14px 4px 4px 14px;
      padding: 6px;
      display: flex; flex-direction: column; justify-content: space-between;
      clip-path: polygon(0 15px, 15px 0, 100% 0, 100% 100%, 15px 100%, 0 calc(100% - 15px));
    }

    /* Module Centre : Relief Topographique 3D */
    .mod-center {
      flex: 2.1;
      border-radius: 8px;
      overflow: hidden;
      clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    }

    /* Module Droit : Schéma Télémétrie */
    .mod-right {
      flex: 0.9;
      border-radius: 4px 14px 14px 4px;
      padding: 6px;
      display: flex; flex-direction: column; justify-content: space-between;
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }

    /* CONTENU MODULE GAUCHE */
    .grid-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-top: 4px; }
    .metric-cell { background: rgba(109, 131, 255, 0.08); padding: 2px; font-size: 0.45rem; border-left: 1px solid var(--cyan); }
    .m-lbl { font-size: 0.35rem; color: rgba(168, 188, 255, 0.6); }
    .m-val { font-weight: bold; color: #fff; }

    .red-status-group { display: flex; gap: 3px; margin-bottom: 2px; }
    .red-status-bar { height: 2px; flex: 1; background: var(--red); box-shadow: 0 0 4px var(--red); }

    /* CONTENU MODULE CENTRE (TERRAIN 3D) */
    #terrain-canvas { width: 100%; height: 100%; }
    .top-coords { position: absolute; top: 5px; left: 8px; font-size: 0.55rem; color: #fff; font-weight: bold; z-index: 2; }
    .top-angle { position: absolute; top: 5px; right: 8px; font-size: 0.55rem; color: var(--cyan); z-index: 2; }
    
    .target-ring-center {
      position: absolute; top: 62%; left: 50%; transform: translate(-50%, -50%);
      width: 32px; height: 32px; border: 1px dashed var(--red); border-radius: 50%;
      pointer-events: none; z-index: 3;
    }
    .target-ring-center::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 3px; height: 3px; background: var(--red); border-radius: 50%; box-shadow: 0 0 5px var(--red);
    }

    /* CONTENU MODULE DROIT (TÉLÉMÉTRIE) */
    .telemetry-schema {
      height: 100%; display: flex; justify-content: space-around; align-items: center; position: relative;
    }
    .t-line-v { width: 1.5px; height: 80%; background: var(--blue); position: relative; }
    .t-node-red {
      position: absolute; left: -2.5px; width: 6.5px; height: 6.5px;
      background: var(--red); border-radius: 50%; box-shadow: 0 0 5px var(--red);
    }


    /* =========================================================
       2. ÉLÉMENTS EXTERNES À DROITE (CERCLES BLANCS & POINTS ROUGES)
       ========================================================= */
    .right-outer-widgets {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 220px;
      height: 220px;
      pointer-events: none;
    }

    /* Premier Cercle Externe */
    .circle-target-main {
      position: absolute;
      right: 20px; top: 20px;
      width: 140px; height: 140px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
    }

    .circle-target-main::before {
      content: ''; position: absolute; inset: 12px;
      border: 1px dashed rgba(255, 255, 255, 0.6);
      border-radius: 50%;
    }

    /* Deuxième Cercle Imbriqué */
    .circle-target-secondary {
      position: absolute;
      right: 45px; top: 45px;
      width: 90px; height: 90px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
    }

    /* Points Rouges Lumineux sur la Cible Droite */
    .red-dot-target-1 {
      position: absolute; right: 110px; top: 40px;
      width: 7px; height: 7px; background: var(--red);
      border-radius: 50%; box-shadow: 0 0 8px var(--red-glow);
    }
    .red-dot-target-2 {
      position: absolute; right: 40px; top: 120px;
      width: 6px; height: 6px; background: var(--red);
      border-radius: 50%; box-shadow: 0 0 8px var(--red-glow);
    }
    .red-dot-target-3 {
      position: absolute; right: 75px; top: 100px;
      width: 5px; height: 5px; background: var(--red);
      border-radius: 50%; box-shadow: 0 0 6px var(--red-glow);
    }

    /* Graduations / Texte au-dessus à droite */
    .right-data-text {
      position: absolute; right: 10px; top: -10px;
      font-size: 0.42rem; color: var(--cyan); text-align: right; line-height: 1.2;
    }


    /* =========================================================
       3. ÉLÉMENTS EXTERNES À GAUCHE (VISEUR & RÉSEAU)
       ========================================================= */
    .left-outer-widgets {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 220px;
      height: 220px;
      pointer-events: none;
    }

    /* Grand Viseur Circulaire Gauche */
    .left-target-ring {
      position: absolute; left: 20px; top: 30px;
      width: 130px; height: 130px;
      border: 1px rgba(255, 255, 255, 0.4) solid;
      border-radius: 50%;
    }
    .left-target-ring::after {
      content: ''; position: absolute; inset: -10px;
      border: 1px dashed rgba(109, 131, 255, 0.4);
      border-radius: 50%;
    }

    /* Points Rouges Gauche */
    .red-dot-left-1 {
      position: absolute; left: 35px; top: 80px;
      width: 8px; height: 8px; background: var(--red);
      border-radius: 50%; box-shadow: 0 0 8px var(--red-glow);
    }
    .red-dot-left-2 {
      position: absolute; left: 110px; top: 45px;
      width: 6px; height: 6px; background: var(--red);
      border-radius: 50%; box-shadow: 0 0 6px var(--red-glow);
    }

    /* Réseau de Lignes Vectorielles */
    .network-svg {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    }

    /* Bloc Code Texte Gauche */
    .left-code-block {
      position: absolute; left: 140px; top: 10px;
      font-size: 0.4rem; color: var(--cyan); line-height: 1.3; opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="hud-viewport">

    <!-- ── 3. ÉLÉMENTS EXTERNES GAUCHE ── -->
    <div class="left-outer-widgets">
      <div class="left-target-ring"></div>
      <div class="red-dot-left-1"></div>
      <div class="red-dot-left-2"></div>

      <div class="left-code-block">
        SYS_LOC // AR<br>
        48.8566 N<br>
        2.3522 E<br>
        ALT: 128m
      </div>

      <svg class="network-svg">
        <line x1="40" y1="85" x2="110" y2="50" stroke="#ff2a55" stroke-width="0.8" opacity="0.7"/>
        <line x1="110" y1="50" x2="160" y2="100" stroke="#6d83ff" stroke-width="0.8" opacity="0.5"/>
        <circle cx="160" cy="100" r="2" fill="#6d83ff"/>
      </svg>
    </div>

    <!-- ── 1. BLOC BLEU PRINCIPAL (STARK CENTRAL) ── -->
    <div class="main-blue-block">
      <div class="outer-chassis"></div>

      <div class="lbl-stark-top">STARK INDUSTRIES</div>
      <div class="lbl-edith">- E D I T H -</div>
      <div class="lbl-b7a-top">B7 A</div>
      <div class="lbl-v57t-top">v5_7T</div>

      <div class="lbl-v5vb-bot">v5_VB</div>
      <div class="lbl-b7a-bot">B7 A</div>
      <div class="lbl-stark-bot">STARK INDUSTRIES</div>

      <!-- 3 MODULES INTERNES -->
      <div class="sub-modules">

        <!-- MODULE GAUCHE : TABLEAU 4x3 DE DONNÉES -->
        <div class="mod-frame mod-left">
          <div class="red-status-group">
            <div class="red-status-bar"></div>
            <div class="red-status-bar" style="opacity:0.4;"></div>
          </div>

          <div class="grid-metrics">
            <div class="metric-cell"><div class="m-lbl">TMP</div><div class="m-val" id="val-temp">--°</div></div>
            <div class="metric-cell"><div class="m-lbl">WND</div><div class="m-val" id="val-wind">--</div></div>
            <div class="metric-cell"><div class="m-lbl">HUM</div><div class="m-val" id="val-hum">--%</div></div>
            <div class="metric-cell"><div class="m-lbl">PRS</div><div class="m-val" id="val-pres">--</div></div>
            <div class="metric-cell"><div class="m-lbl">LAT</div><div class="m-val" id="val-lat">--</div></div>
            <div class="metric-cell"><div class="m-lbl">LON</div><div class="m-val" id="val-lon">--</div></div>
            <div class="metric-cell"><div class="m-lbl">ALT</div><div class="m-val">128m</div></div>
            <div class="metric-cell"><div class="m-lbl">SYS</div><div class="m-val">OK</div></div>
          </div>

          <div style="font-size: 0.35rem; color: var(--cyan); margin-top: 3px;">
            SEC_LOCK // ACTIVE
          </div>
        </div>

        <!-- MODULE CENTRE : RELIEF 3D TOPOGRAPHIQUE -->
        <div class="mod-frame mod-center">
          <div class="top-coords">E. 473 D. 973</div>
          <div class="top-angle">67° C76</div>

          <canvas id="terrain-canvas"></canvas>

          <div class="target-ring-center"></div>
        </div>

        <!-- MODULE DROIT : SCHÉMA TÉLÉMÉTRIE -->
        <div class="mod-frame mod-right">
          <div style="font-size: 0.38rem; color: var(--cyan); border-bottom: 1px solid rgba(109,131,255,0.3);">
            TELEMETRY
          </div>

          <div class="telemetry-schema">
            <div class="t-line-v"><div class="t-node-red" style="top:20%;"></div></div>
            <div class="t-line-v"><div class="t-node-red" style="top:60%;"></div></div>
            <div class="t-line-v"><div class="t-node-red" style="top:40%;"></div></div>
          </div>

          <div style="font-size: 0.35rem; color: var(--red); text-align: right;">
            ● SCAN
          </div>
        </div>

      </div>
    </div>

    <!-- ── 2. ÉLÉMENTS EXTERNES DROITE (CERCLES BLANCS ET POINTS ROUGES) ── -->
    <div class="right-outer-widgets">
      <div class="right-data-text">
        TARGET_ACQUIRED<br>
        DIST: 420m<br>
        RADAR_TRACKING
      </div>

      <div class="circle-target-main"></div>
      <div class="circle-target-secondary"></div>

      <!-- Les points rouges vus sur la photo -->
      <div class="red-dot-target-1"></div>
      <div class="red-dot-target-2"></div>
      <div class="red-dot-target-3"></div>
    </div>

  </div>

  <!-- THREE.JS POUR RENDERER LE TERRAIN TOPOGRAPHIQUE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('terrain-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(48, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(0, -7.5, 5.8);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);

    // Relief spécifique style vallée au centre + montagnes latérales
    const geometry = new THREE.PlaneGeometry(16, 16, 42, 42);
    const pos = geometry.attributes.position;

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      // Équation pour former la cuvette/vallée centrale
      const z = (Math.cos(x * 0.4) * 1.5) + (Math.sin(y * 0.6) * 0.8) + (Math.sin(x * 1.2) * 0.3);
      pos.setZ(i, z);
    }
    geometry.computeVertexNormals();

    const material = new THREE.MeshBasicMaterial({
      color: 0x6d83ff,
      wireframe: true,
      transparent: true,
      opacity: 0.7
    });

    const terrain = new THREE.Mesh(geometry, material);
    scene.add(terrain);

    // Balises verticales d'altitude blanches
    function createBeacon(x, y, height) {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x, y, 0),
        new THREE.Vector3(x, y, height)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
      const line = new THREE.Line(lineGeo, lineMat);
      terrain.add(line);
    }
    createBeacon(-2.5, 1.5, 2.2);
    createBeacon(3.0, -1.0, 2.8);

    function animate() {
      requestAnimationFrame(animate);
      terrain.rotation.z += 0.0018;
      renderer.render(scene, camera);
    }
    animate();

    // Météo et GPS
    async function fetchMeteo(lat, lon) {
      document.getElementById('val-lat').textContent = lat.toFixed(1);
      document.getElementById('val-lon').textContent = lon.toFixed(1);
      try {
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m`);
        const d = await r.json();
        document.getElementById('val-temp').textContent = `${Math.round(d.current.temperature_2m)}°`;
        document.getElementById('val-wind').textContent = `${Math.round(d.current.wind_speed_10m)}`;
        document.getElementById('val-hum').textContent = `${d.current.relative_humidity_2m}%`;
        document.getElementById('val-pres').textContent = `${Math.round(d.current.surface_pressure)}`;
      } catch (e) {}
    }

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(p => fetchMeteo(p.coords.latitude, p.coords.longitude), () => fetchMeteo(48.85, 2.35));
    } else { fetchMeteo(48.85, 2.35); }
  </script>
</body>
</html>
