<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUD EDITH - Movie Replica</title>
  <style>
    :root {
      --stark-blue: #738aff;
      --stark-glow: rgba(115, 138, 255, 0.6);
      --stark-cyan: #b3c2ff;
      --stark-red: #ff2a55;
      --bg-glass: rgba(6, 12, 28, 0.75);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; user-select: none; }

    body {
      background-color: #02040a;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 20px;
    }

    /* SCÈNE GLOBALE DU HUD */
    .hud-stage {
      position: relative;
      width: 720px;
      height: 280px;
      filter: drop-shadow(0 0 10px var(--stark-glow));
    }

    /* ── 1. CHÂSSIS EXTÉRIEUR GLOBAL ── */
    .outer-frame {
      position: absolute;
      inset: 0;
      border: 1.5px solid var(--stark-blue);
      clip-path: polygon(
        0% 25%, 8% 0%, 92% 0%, 100% 25%, 
        100% 75%, 92% 100%, 8% 100%, 0% 75%
      );
      background: rgba(4, 9, 22, 0.5);
      backdrop-filter: blur(4px);
    }

    /* Trame de fond en points / nid d'abeille */
    .outer-frame::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(var(--stark-blue) 1px, transparent 0);
      background-size: 6px 6px;
      opacity: 0.18;
    }

    /* EN-TÊTE & PIED DU CHÂSSIS EXTÉRIEUR */
    .header-edith {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      font-size: 1rem; font-weight: 900; letter-spacing: 6px; color: #fff;
      text-shadow: 0 0 10px var(--stark-blue); z-index: 10;
    }
    .sub-stark-top {
      position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
      font-size: 0.38rem; letter-spacing: 2px; color: var(--stark-cyan); opacity: 0.7; z-index: 10;
    }
    .top-left-tag { position: absolute; top: 12px; left: 50px; font-size: 0.55rem; color: #fff; font-weight: bold; }
    .top-right-tag { position: absolute; top: 12px; right: 50px; font-size: 0.55rem; color: var(--stark-cyan); }

    .bottom-left-tag { position: absolute; bottom: 12px; left: 60px; font-size: 0.55rem; color: #fff; font-weight: bold; }
    .bottom-right-tag { position: absolute; bottom: 12px; right: 60px; font-size: 0.55rem; color: #fff; font-weight: bold; }
    .bottom-stark { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 0.38rem; color: var(--stark-cyan); letter-spacing: 2px; }

    /* ── 2. CONTENEUR DES 3 MODULES INTERNES ── */
    .modules-container {
      position: absolute;
      top: 36px; bottom: 32px; left: 35px; right: 35px;
      display: flex; gap: 8px; z-index: 5;
    }

    /* FORMES DE CADRES IMBRIQUÉS À BORDS ARRONDIS/BISEAUTÉS */
    .mod-box {
      background: var(--bg-glass);
      border: 1.5px solid var(--stark-blue);
      position: relative;
    }

    /* MODULE GAUCHE : TABLEAU DE DONNÉES NUMÉRIQUES */
    .mod-left {
      flex: 1;
      border-radius: 12px 2px 2px 12px;
      padding: 8px;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    /* MODULE CENTRE : RELIEF 3D TOPOGRAPHIQUE */
    .mod-center {
      flex: 2;
      border-radius: 10px;
      overflow: hidden;
    }

    /* MODULE DROIT : TÉLÉMÉTRIE / ÉGALISEUR */
    .mod-right {
      flex: 1;
      border-radius: 2px 12px 12px 2px;
      padding: 8px;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    /* ── DÉTAILS DENTRE LES MODULES ── */

    /* Grille de métriques à gauche */
    .data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .data-item { background: rgba(115, 138, 255, 0.08); padding: 2px 3px; font-size: 0.48rem; border-left: 1.5px solid var(--stark-cyan); }
    .data-lbl { font-size: 0.38rem; color: rgba(179, 194, 255, 0.6); }
    .data-val { color: #fff; font-weight: bold; }

    /* Barres d'état rouges haut-gauche */
    .top-red-bars { display: flex; gap: 4px; margin-bottom: 4px; }
    .red-bar { height: 2px; flex: 1; background: var(--stark-red); box-shadow: 0 0 4px var(--stark-red); }

    /* Relief 3D central & annotations */
    #terrain-canvas { width: 100%; height: 100%; }
    .terrain-tag-tl { position: absolute; top: 6px; left: 10px; font-size: 0.55rem; color: #fff; font-weight: bold; z-index: 2; }
    .terrain-tag-tr { position: absolute; top: 6px; right: 10px; font-size: 0.55rem; color: var(--stark-cyan); z-index: 2; }

    /* Cible centrale rouge */
    .target-center {
      position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
      width: 36px; height: 36px; border: 1px dashed var(--stark-red); border-radius: 50%;
      z-index: 3; pointer-events: none;
    }
    .target-center::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 3px; height: 3px; background: var(--stark-red); border-radius: 50%; box-shadow: 0 0 5px var(--stark-red);
    }

    /* Graphiques de télémétrie à droite */
    .telemetry-lines { display: flex; justify-content: space-between; height: 100%; align-items: flex-end; padding: 4px; }
    .t-col { width: 3px; background: rgba(115, 138, 255, 0.2); position: relative; }
    .t-fill { width: 100%; background: var(--stark-blue); position: absolute; bottom: 0; }
    .t-dot { width: 4px; height: 4px; background: var(--stark-red); border-radius: 50%; position: absolute; left: -0.5px; box-shadow: 0 0 4px var(--stark-red); }

    /* ── 3. NOEUDS DE RÉSEAU EXTÉRIEURS (FLOTTANTS) ── */
    .network-nodes-left {
      position: absolute; left: -60px; top: 30%; width: 80px; height: 100px; z-index: 1; pointer-events: none;
    }
    .network-nodes-right {
      position: absolute; right: -60px; top: 30%; width: 80px; height: 100px; z-index: 1; pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="hud-stage">

    <!-- NOEUDS DE RÉSEAU HORS CADRE -->
    <svg class="network-nodes-left" viewBox="0 0 80 100">
      <circle cx="20" cy="30" r="2" fill="#ff2a55" />
      <circle cx="50" cy="60" r="2" fill="#738aff" />
      <line x1="20" y1="30" x2="50" y2="60" stroke="#738aff" stroke-width="0.8" opacity="0.6"/>
      <line x1="50" y1="60" x2="80" y2="40" stroke="#738aff" stroke-width="0.8" opacity="0.6"/>
      <circle cx="80" cy="40" r="1.5" fill="#738aff" />
    </svg>

    <svg class="network-nodes-right" viewBox="0 0 80 100">
      <circle cx="20" cy="50" r="2" fill="#738aff" />
      <circle cx="60" cy="20" r="2" fill="#ff2a55" />
      <line x1="20" y1="50" x2="60" y2="20" stroke="#738aff" stroke-width="0.8" opacity="0.6"/>
    </svg>

    <!-- 1. CHÂSSIS EXTÉRIEUR STARK -->
    <div class="outer-frame"></div>

    <div class="sub-stark-top">STARK INDUSTRIES</div>
    <div class="header-edith">- E D I T H -</div>
    <div class="top-left-tag">B7 A</div>
    <div class="top-right-tag">v5_7T</div>

    <div class="bottom-left-tag">v5_VB</div>
    <div class="bottom-right-tag">B7 A</div>
    <div class="bottom-stark">STARK INDUSTRIES</div>

    <!-- 2. LES 3 MODULES PRINCIPAUX IMBRIQUÉS -->
    <div class="modules-container">

      <!-- MODULE GAUCHE : TABLEAU DE DONNÉES -->
      <div class="mod-box mod-left">
        <div class="top-red-bars">
          <div class="red-bar"></div>
          <div class="red-bar" style="opacity: 0.5;"></div>
        </div>

        <div class="data-grid">
          <div class="data-item"><div class="data-lbl">TEMP</div><div class="data-val" id="val-temp">--°C</div></div>
          <div class="data-item"><div class="data-lbl">WIND</div><div class="data-val" id="val-wind">--km</div></div>
          <div class="data-item"><div class="data-lbl">HUM</div><div class="data-val" id="val-hum">--%</div></div>
          <div class="data-item"><div class="data-lbl">PRES</div><div class="data-val" id="val-pres">--hPa</div></div>
          <div class="data-item"><div class="data-lbl">LAT</div><div class="data-val" id="val-lat">--</div></div>
          <div class="data-item"><div class="data-lbl">LON</div><div class="data-val" id="val-lon">--</div></div>
        </div>

        <div style="font-size: 0.38rem; color: var(--stark-cyan); opacity: 0.7; margin-top: 4px;">
          SYS_STAT: OK // LIVE_FEED
        </div>
      </div>

      <!-- MODULE CENTRE : TERRAIN 3D TOPOGRAPHIQUE -->
      <div class="mod-box mod-center">
        <div class="terrain-tag-tl">E. 473 D. 973</div>
        <div class="terrain-tag-tr">67° C76</div>

        <canvas id="terrain-canvas"></canvas>

        <div class="target-center"></div>
      </div>

      <!-- MODULE DROIT : TÉLÉMÉTRIE / GRAPHIQUE -->
      <div class="mod-box mod-right">
        <div style="font-size: 0.4rem; color: var(--stark-cyan); border-bottom: 1px solid rgba(115,138,255,0.3); padding-bottom: 2px;">
          RADAR_TEL
        </div>

        <div class="telemetry-lines">
          <div class="t-col" style="height: 80%;"><div class="t-fill" style="height: 60%;"></div><div class="t-dot" style="top: 30%;"></div></div>
          <div class="t-col" style="height: 100%;"><div class="t-fill" style="height: 40%;"></div><div class="t-dot" style="top: 50%;"></div></div>
          <div class="t-col" style="height: 60%;"><div class="t-fill" style="height: 80%;"></div></div>
          <div class="t-col" style="height: 90%;"><div class="t-fill" style="height: 30%;"></div><div class="t-dot" style="top: 20%;"></div></div>
          <div class="t-col" style="height: 70%;"><div class="t-fill" style="height: 70%;"></div></div>
        </div>

        <div style="font-size: 0.38rem; color: var(--stark-red); text-align: right;">
          ● SCANNING
        </div>
      </div>

    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ── TERRAIN 3D AVEC PICS D'ALTITUDE ──
    const canvas = document.getElementById('terrain-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(0, -8, 6.5);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);

    const geometry = new THREE.PlaneGeometry(18, 18, 40, 40);
    const pos = geometry.attributes.position;

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const z = Math.sin(x * 0.5) * Math.cos(y * 0.5) * 1.3 + Math.sin(x * 1.1) * 0.4;
      pos.setZ(i, z);
    }
    geometry.computeVertexNormals();

    const material = new THREE.MeshBasicMaterial({
      color: 0x738aff,
      wireframe: true,
      transparent: true,
      opacity: 0.65
    });

    const terrain = new THREE.Mesh(geometry, material);
    scene.add(terrain);

    // BALISES D'ALTITUDE (LIGNES VERTICALES NÉON DANS LE RELIEF)
    function addBeacon(x, y, h) {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x, y, 0),
        new THREE.Vector3(x, y, h)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
      const line = new THREE.Line(lineGeo, lineMat);
      terrain.add(line);
    }
    addBeacon(-3, 2, 2.5);
    addBeacon(4, -1, 3.0);

    function animate() {
      requestAnimationFrame(animate);
      terrain.rotation.z += 0.002;
      renderer.render(scene, camera);
    }
    animate();

    // ── GÉOLOCALISATION ET MÉTÉO EN DIRECT ──
    async function loadData(lat, lon) {
      document.getElementById('val-lat').textContent = lat.toFixed(2);
      document.getElementById('val-lon').textContent = lon.toFixed(2);
      try {
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m`);
        const d = await r.json();
        document.getElementById('val-temp').textContent = `${Math.round(d.current.temperature_2m)}°C`;
        document.getElementById('val-wind').textContent = `${Math.round(d.current.wind_speed_10m)}`;
        document.getElementById('val-hum').textContent = `${d.current.relative_humidity_2m}%`;
        document.getElementById('val-pres').textContent = `${Math.round(d.current.surface_pressure)}`;
      } catch (e) { console.error(e); }
    }

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(p => loadData(p.coords.latitude, p.coords.longitude), () => loadData(48.85, 2.35));
    } else { loadData(48.85, 2.35); }
  </script>
</body>
</html>
