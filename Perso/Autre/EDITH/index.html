<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUD EDITH - Ultra Precise Replica</title>
  <style>
    :root {
      --stark-blue: #6079ff;
      --stark-glow: rgba(96, 121, 255, 0.7);
      --stark-cyan: #a3b5ff;
      --stark-red: #ff2a55;
      --stark-red-glow: rgba(255, 42, 85, 0.85);
      --bg-hud: rgba(5, 10, 25, 0.75);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; user-select: none; }

    body {
      background-color: #020409;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: flex-end; /* Calé tout en bas */
      justify-content: center;
      padding-bottom: 12px;
      background-image: 
        radial-gradient(circle at 50% 90%, rgba(96, 121, 255, 0.12) 0%, transparent 60%);
    }

    /* VUE GLOBALE DU HUD */
    .hud-viewport {
      position: relative;
      width: 1000px;
      height: 280px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* =========================================================
       1. CŒUR CENTRAL (CARTE 3D EN ROTATION) & AILETTES
       ========================================================= */
    .core-system {
      position: relative;
      width: 520px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 12px var(--stark-glow));
      z-index: 10;
    }

    /* MODULE CENTRAL (TERRAIN 3D) */
    .center-core-card {
      position: relative;
      width: 240px;
      height: 140px;
      background: var(--bg-hud);
      border: 1.5px solid var(--stark-blue);
      border-radius: 8px;
      overflow: hidden;
      z-index: 5;
      clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
      backdrop-filter: blur(4px);
    }

    #terrain-canvas { width: 100%; height: 100%; }

    .core-coords-tl { position: absolute; top: 4px; left: 6px; font-size: 0.5rem; color: #fff; font-weight: bold; z-index: 6; }
    .core-coords-tr { position: absolute; top: 4px; right: 6px; font-size: 0.5rem; color: var(--stark-cyan); z-index: 6; }

    .center-red-target {
      position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
      width: 30px; height: 30px; border: 1px dashed var(--stark-red); border-radius: 50%;
      pointer-events: none; z-index: 6;
      animation: spinTarget 10s linear infinite;
    }
    .center-red-target::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 3px; height: 3px; background: var(--stark-red); border-radius: 50%; box-shadow: 0 0 6px var(--stark-red);
    }

    /* AILETTE HAUTE (-EDITH-) */
    .wing-top {
      position: absolute;
      top: 0;
      width: 440px;
      height: 38px;
      border: 1.5px solid var(--stark-blue);
      border-bottom: none;
      clip-path: polygon(0 100%, 8% 0, 92% 0, 100% 100%);
      background: var(--bg-hud);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    .lbl-edith { font-size: 1rem; font-weight: 900; letter-spacing: 6px; color: #fff; text-shadow: 0 0 8px var(--stark-blue); }
    .lbl-stark-top { position: absolute; top: 1px; font-size: 0.35rem; color: var(--stark-cyan); letter-spacing: 2px; }
    .lbl-b7a-top { position: absolute; top: 8px; left: 35px; font-size: 0.5rem; color: #fff; font-weight: bold; }
    .lbl-v57t-top { position: absolute; top: 8px; right: 35px; font-size: 0.5rem; color: var(--stark-cyan); }

    /* AILETTE BASSE */
    .wing-bottom {
      position: absolute;
      bottom: 0;
      width: 440px;
      height: 36px;
      border: 1.5px solid var(--stark-blue);
      border-top: none;
      clip-path: polygon(8% 100%, 0 0, 100% 0, 92% 100%);
      background: var(--bg-hud);
      z-index: 4;
    }
    .lbl-v5vb-bot { position: absolute; bottom: 8px; left: 45px; font-size: 0.5rem; color: #fff; font-weight: bold; }
    .lbl-b7a-bot { position: absolute; bottom: 8px; right: 45px; font-size: 0.5rem; color: #fff; font-weight: bold; }
    .lbl-stark-bot { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); font-size: 0.35rem; color: var(--stark-cyan); letter-spacing: 2px; }

    /* AILETTE GAUCHE (TABLEAU DE DONNÉES) */
    .wing-left {
      position: absolute;
      left: 10px;
      width: 125px;
      height: 135px;
      border: 1.5px solid var(--stark-blue);
      border-radius: 12px 2px 2px 12px;
      background: var(--bg-hud);
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      clip-path: polygon(0 15px, 15px 0, 100% 0, 100% 100%, 15px 100%, 0 calc(100% - 15px));
      z-index: 4;
    }

    .grid-data { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; }
    .d-cell { background: rgba(96, 121, 255, 0.08); padding: 2px 3px; font-size: 0.45rem; border-left: 1.5px solid var(--stark-cyan); }
    .d-lbl { font-size: 0.35rem; color: rgba(163, 181, 255, 0.6); }
    .d-val { font-weight: bold; color: #fff; }

    .red-bars-group { display: flex; gap: 3px; }
    .red-bar-item { height: 2px; flex: 1; background: var(--stark-red); box-shadow: 0 0 4px var(--stark-red); }

    /* AILETTE DROITE (TÉLÉMÉTRIE / ÉGALISEUR) */
    .wing-right {
      position: absolute;
      right: 10px;
      width: 125px;
      height: 135px;
      border: 1.5px solid var(--stark-blue);
      border-radius: 2px 12px 12px 2px;
      background: var(--bg-hud);
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
      z-index: 4;
    }

    .telemetry-container { display: flex; justify-content: space-around; height: 80px; align-items: flex-end; }
    .t-col-line { width: 1.5px; height: 100%; background: rgba(96, 121, 255, 0.3); position: relative; }
    .t-dot-red { position: absolute; left: -2.5px; width: 6.5px; height: 6.5px; background: var(--stark-red); border-radius: 50%; box-shadow: 0 0 6px var(--stark-red); }


    /* =========================================================
       2. ÉLÉMENTS EXTERNES DENSES À DROITE (CERCLES & CIBLES)
       ========================================================= */
    .outer-right-zone {
      position: absolute;
      right: -20px;
      bottom: 10px;
      width: 280px;
      height: 240px;
      pointer-events: none;
    }

    /* Grand Cercle Double de Visée */
    .target-circle-outer {
      position: absolute;
      right: 30px;
      bottom: 20px;
      width: 150px;
      height: 150px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
    }
    .target-circle-outer::before {
      content: ''; position: absolute; inset: 10px;
      border: 1px dashed rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: spinTarget 25s linear infinite reverse;
    }

    .target-circle-inner {
      position: absolute;
      right: 55px;
      bottom: 45px;
      width: 100px;
      height: 100px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
    }

    /* Points Rouges Lumineux Droite */
    .p-red-1 { position: absolute; right: 135px; bottom: 100px; width: 8px; height: 8px; background: var(--stark-red); border-radius: 50%; box-shadow: 0 0 10px var(--stark-red-glow); }
    .p-red-2 { position: absolute; right: 60px; bottom: 135px; width: 6px; height: 6px; background: var(--stark-red); border-radius: 50%; box-shadow: 0 0 8px var(--stark-red-glow); }
    .p-red-3 { position: absolute; right: 85px; bottom: 35px; width: 7px; height: 7px; background: var(--stark-red); border-radius: 50%; box-shadow: 0 0 8px var(--stark-red-glow); }

    /* Panneau de Télémetrie Secondaire Droite */
    .right-extra-panel {
      position: absolute; right: 10px; top: 10px;
      font-size: 0.4rem; color: var(--stark-cyan); text-align: right; line-height: 1.3;
    }


    /* =========================================================
       3. ÉLÉMENTS EXTERNES DENSES À GAUCHE (RÉSEAUX & ANNEAUX)
       ========================================================= */
    .outer-left-zone {
      position: absolute;
      left: -20px;
      bottom: 10px;
      width: 280px;
      height: 240px;
      pointer-events: none;
    }

    /* Anneau de Balayage Gauche */
    .left-radar-ring {
      position: absolute; left: 30px; bottom: 30px;
      width: 140px; height: 140px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
    }
    .left-radar-ring::after {
      content: ''; position: absolute; inset: -10px;
      border: 1px dashed rgba(96, 121, 255, 0.5);
      border-radius: 50%;
      animation: spinTarget 20s linear infinite;
    }

    /* Points Rouges Gauche */
    .p-red-left-1 { position: absolute; left: 50px; bottom: 90px; width: 8px; height: 8px; background: var(--stark-red); border-radius: 50%; box-shadow: 0 0 10px var(--stark-red-glow); }
    .p-red-left-2 { position: absolute; left: 130px; bottom: 130px; width: 6px; height: 6px; background: var(--stark-red); border-radius: 50%; box-shadow: 0 0 8px var(--stark-red-glow); }

    /* SVG Réseau de Constellation Gauche */
    .left-svg-mesh { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Bloc Code Gauche */
    .left-extra-code {
      position: absolute; left: 10px; top: 15px;
      font-size: 0.4rem; color: var(--stark-cyan); line-height: 1.3; opacity: 0.85;
    }

    @keyframes spinTarget {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="hud-viewport">

    <!-- ── 3. EXTÉRIEUR GAUCHE (DENSE) ── -->
    <div class="outer-left-zone">
      <div class="left-extra-code">
        SYS_AR // ACTIVE<br>
        LOC: 48.8566 N<br>
        REF: 2.3522 E<br>
        SAT_LINK: 98%
      </div>

      <div class="left-radar-ring"></div>
      <div class="p-red-left-1"></div>
      <div class="p-red-left-2"></div>

      <svg class="left-svg-mesh">
        <line x1="54" y1="146" x2="133" y2="106" stroke="#ff2a55" stroke-width="0.8" opacity="0.8"/>
        <line x1="133" y1="106" x2="200" y2="160" stroke="#6079ff" stroke-width="0.8" opacity="0.5"/>
        <circle cx="200" cy="160" r="2.5" fill="#6079ff"/>
        <circle cx="170" cy="70" r="2" fill="#a3b5ff"/>
        <line x1="133" y1="106" x2="170" y2="70" stroke="#a3b5ff" stroke-width="0.6" stroke-dasharray="2 2"/>
      </svg>
    </div>

    <!-- ── 1. NORTON / CŒUR CENTRAL ET SES AILETTES ── -->
    <div class="core-system">

      <!-- AILETTE HAUTE -->
      <div class="wing-top">
        <div class="lbl-stark-top">STARK INDUSTRIES</div>
        <div class="lbl-edith">- E D I T H -</div>
        <div class="lbl-b7a-top">B7 A</div>
        <div class="lbl-v57t-top">v5_7T</div>
      </div>

      <!-- AILETTE GAUCHE -->
      <div class="wing-left">
        <div class="red-bars-group">
          <div class="red-bar-item"></div>
          <div class="red-bar-item" style="opacity:0.4;"></div>
        </div>

        <div class="grid-data">
          <div class="d-cell"><div class="d-lbl">TMP</div><div class="d-val" id="val-temp">--°</div></div>
          <div class="d-cell"><div class="d-lbl">WND</div><div class="d-val" id="val-wind">--</div></div>
          <div class="d-cell"><div class="d-lbl">HUM</div><div class="d-val" id="val-hum">--%</div></div>
          <div class="d-cell"><div class="d-lbl">PRS</div><div class="d-val" id="val-pres">--</div></div>
          <div class="d-cell"><div class="d-lbl">LAT</div><div class="d-val" id="val-lat">--</div></div>
          <div class="d-cell"><div class="d-lbl">LON</div><div class="d-val" id="val-lon">--</div></div>
        </div>

        <div style="font-size: 0.35rem; color: var(--stark-cyan);">
          STATUS: ONLINE
        </div>
      </div>

      <!-- CŒUR CENTRAL : TERRAIN TOPOGRAPHIQUE 3D EN ROTATION -->
      <div class="center-core-card">
        <div class="core-coords-tl">E. 473 D. 973</div>
        <div class="core-coords-tr">67° C76</div>

        <canvas id="terrain-canvas"></canvas>

        <div class="center-red-target"></div>
      </div>

      <!-- AILETTE DROITE -->
      <div class="wing-right">
        <div style="font-size: 0.38rem; color: var(--stark-cyan); border-bottom: 1px solid rgba(96,121,255,0.3);">
          TELEMETRY
        </div>

        <div class="telemetry-container">
          <div class="t-col-line"><div class="t-dot-red" style="top:25%;"></div></div>
          <div class="t-col-line"><div class="t-dot-red" style="top:65%;"></div></div>
          <div class="t-col-line"><div class="t-dot-red" style="top:40%;"></div></div>
          <div class="t-col-line"><div class="t-dot-red" style="top:80%;"></div></div>
        </div>

        <div style="font-size: 0.35rem; color: var(--stark-red); text-align: right;">
          ● SCANNING
        </div>
      </div>

      <!-- AILETTE BASSE -->
      <div class="wing-bottom">
        <div class="lbl-v5vb-bot">v5_VB</div>
        <div class="lbl-b7a-bot">B7 A</div>
        <div class="lbl-stark-bot">STARK INDUSTRIES</div>
      </div>

    </div>

    <!-- ── 2. EXTÉRIEUR DROIT (DENSE) ── -->
    <div class="outer-right-zone">
      <div class="right-extra-panel">
        TARGET_LOCK<br>
        RANGE: 420m<br>
        ALT_DIFF: +12m<br>
        VECTOR_SYS
      </div>

      <div class="target-circle-outer"></div>
      <div class="target-circle-inner"></div>

      <!-- Points rouges cibles -->
      <div class="p-red-1"></div>
      <div class="p-red-2"></div>
      <div class="p-red-3"></div>

      <svg style="position:absolute; inset:0; width:100%; height:100%;">
        <line x1="145" y1="140" x2="220" y2="105" stroke="#ff2a55" stroke-width="0.8" opacity="0.7"/>
        <circle cx="220" cy="105" r="2" fill="#ff2a55"/>
      </svg>
    </div>

  </div>

  <!-- THREE.JS POUR RENDERER LE TERRAIN TOPOGRAPHIQUE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('terrain-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(48, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(0, -7.5, 5.8);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);

    // Relief spécifique style vallée au centre + montagnes latérales
    const geometry = new THREE.PlaneGeometry(16, 16, 42, 42);
    const pos = geometry.attributes.position;

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const z = (Math.cos(x * 0.4) * 1.5) + (Math.sin(y * 0.6) * 0.8) + (Math.sin(x * 1.2) * 0.3);
      pos.setZ(i, z);
    }
    geometry.computeVertexNormals();

    const material = new THREE.MeshBasicMaterial({
      color: 0x6079ff,
      wireframe: true,
      transparent: true,
      opacity: 0.75
    });

    const terrain = new THREE.Mesh(geometry, material);
    scene.add(terrain);

    // Balises d'altitude
    function createBeacon(x, y, height) {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x, y, 0),
        new THREE.Vector3(x, y, height)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
      const line = new THREE.Line(lineGeo, lineMat);
      terrain.add(line);
    }
    createBeacon(-2.5, 1.5, 2.2);
    createBeacon(3.0, -1.0, 2.8);

    function animate() {
      requestAnimationFrame(animate);
      terrain.rotation.z += 0.0022; // Rotations du terrain
      renderer.render(scene, camera);
    }
    animate();

    // Géolocalisation & Météo Réelle
    async function fetchMeteo(lat, lon) {
      document.getElementById('val-lat').textContent = lat.toFixed(1);
      document.getElementById('val-lon').textContent = lon.toFixed(1);
      try {
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m`);
        const d = await r.json();
        document.getElementById('val-temp').textContent = `${Math.round(d.current.temperature_2m)}°`;
        document.getElementById('val-wind').textContent = `${Math.round(d.current.wind_speed_10m)}`;
        document.getElementById('val-hum').textContent = `${d.current.relative_humidity_2m}%`;
        document.getElementById('val-pres').textContent = `${Math.round(d.current.surface_pressure)}`;
      } catch (e) {}
    }

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(p => fetchMeteo(p.coords.latitude, p.coords.longitude), () => fetchMeteo(48.85, 2.35));
    } else { fetchMeteo(48.85, 2.35); }
  </script>
</body>
</html>
