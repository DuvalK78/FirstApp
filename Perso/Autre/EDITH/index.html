<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUD EDITH - Pixel Perfect Film</title>
  <style>
    :root {
      --stark-blue: #637bff;
      --stark-glow: #4a63ff;
      --stark-cyan: #a1b5ff;
      --stark-red: #ff2d55;
      --stark-bg: rgba(8, 14, 32, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; user-select: none; }

    body {
      background-color: #03060d;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 30px;
      /* Trame en fond */
      background-image: 
        radial-gradient(circle at 65% 75%, rgba(99, 123, 255, 0.12) 0%, transparent 50%),
        radial-gradient(rgba(99, 123, 255, 0.15) 1px, transparent 1px);
      background-size: 100% 100%, 12px 12px;
    }

    /* SCÈNE GLOBALE HUD */
    .hud-stage {
      position: relative;
      width: 780px;
      height: 320px;
      filter: drop-shadow(0 0 12px rgba(99, 123, 255, 0.4));
    }

    /* --- ÉLÉMENTS FLOTTANTS HORS-CADRE (GAUCHE & EXTIERIEUR) --- */
    
    /* Viseur secondaire à gauche */
    .floating-target-left {
      position: absolute;
      left: 10px;
      top: 40px;
      width: 110px;
      height: 110px;
      border: 1px dashed rgba(99, 123, 255, 0.35);
      border-radius: 50%;
      z-index: 1;
    }
    .floating-target-left::before {
      content: ''; position: absolute; inset: -15px;
      border: 1px solid rgba(255, 45, 85, 0.25);
      border-radius: 50%;
    }

    /* Mini schéma / circuit vectoriel flottant en bas à gauche */
    .floating-vector-map {
      position: absolute;
      left: 170px;
      bottom: 15px;
      width: 100px;
      height: 80px;
      z-index: 2;
      opacity: 0.85;
    }

    /* Bloc de texte "code" flottant à côté du cadre */
    .floating-code-block {
      position: absolute;
      left: 185px;
      top: 60px;
      font-size: 0.42rem;
      color: var(--stark-cyan);
      line-height: 1.3;
      opacity: 0.75;
      z-index: 2;
      text-shadow: 0 0 4px var(--stark-glow);
    }

    /* --- MODULE PRINCIPAL (DOUBLE CADRE BINDÉ) --- */
    .main-hud-group {
      position: absolute;
      right: 40px;
      bottom: 20px;
      width: 480px;
      height: 240px;
      display: flex;
      gap: 12px;
      z-index: 5;
    }

    /* FOND EN NID D'ABEILLE/POINTS POUR LE MODULE */
    .hud-mesh-bg {
      position: absolute;
      inset: -10px -20px;
      background-image: radial-gradient(var(--stark-blue) 1px, transparent 0);
      background-size: 8px 8px;
      opacity: 0.15;
      z-index: -1;
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
    }

    /* MODULE GAUCHE : TABLEAU DE DONNÉES / METRIQUES */
    .data-card {
      flex: 1.1;
      background: var(--stark-bg);
      border: 1.5px solid var(--stark-blue);
      border-radius: 12px 2px 12px 2px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      backdrop-filter: blur(4px);
      clip-path: polygon(0 15px, 15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }

    /* MODULE DROITE : RELIEF 3D TOPOGRAPHIQUE */
    .terrain-card {
      flex: 1.2;
      background: var(--stark-bg);
      border: 1.5px solid var(--stark-blue);
      border-radius: 2px 12px 2px 12px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(4px);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
    }

    /* TEXTES D'IDENTIFICATION OUTSIDE/ABOVE CARDS */
    .tag-b7a {
      position: absolute;
      top: -22px;
      left: 40px;
      font-size: 0.65rem;
      font-weight: bold;
      color: #fff;
      letter-spacing: 2px;
    }

    .tag-stark-top {
      position: absolute;
      top: -18px;
      right: 20px;
      font-size: 0.42rem;
      color: var(--stark-cyan);
      letter-spacing: 2px;
    }

    .tag-v5vb {
      position: absolute;
      bottom: -20px;
      left: 60px;
      font-size: 0.6rem;
      font-weight: bold;
      color: #fff;
      letter-spacing: 1px;
    }

    .tag-stark-bottom {
      position: absolute;
      bottom: -18px;
      right: 20px;
      font-size: 0.42rem;
      color: var(--stark-cyan);
      letter-spacing: 2px;
    }

    /* DÉTAILS DU TABLEAU DE DONNÉES (GRILLE INTÉRIEURE DENSE) */
    .data-header-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(99, 123, 255, 0.4);
      padding-bottom: 4px;
      font-size: 0.5rem;
      color: var(--stark-cyan);
    }

    .data-grid-table {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 6px;
    }

    .grid-cell {
      background: rgba(99, 123, 255, 0.08);
      border-left: 2px solid var(--stark-red);
      padding: 3px 4px;
      font-size: 0.52rem;
    }

    .cell-lbl { font-size: 0.4rem; color: rgba(161, 181, 255, 0.6); }
    .cell-val { font-weight: bold; color: #fff; margin-top: 1px; }

    /* BARRES ROUGES D'ÉTAT INTÉRIEURES */
    .status-bars {
      display: flex;
      gap: 3px;
      margin-top: 6px;
    }

    .status-bar-item {
      flex: 1;
      height: 3px;
      background: rgba(255, 45, 85, 0.3);
      position: relative;
    }

    .status-bar-fill {
      height: 100%;
      background: var(--stark-red);
      box-shadow: 0 0 6px var(--stark-red);
    }

    /* TERRAIN CANVAS & RÉTICULES INTERNES */
    #terrain-canvas {
      width: 100%;
      height: 100%;
      mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 80%);
      -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 80%);
    }

    .terrain-overlay-coords {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 0.55rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 4px var(--stark-glow);
      z-index: 2;
    }

    .terrain-overlay-code {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.55rem;
      color: var(--stark-cyan);
      z-index: 2;
    }

    /* CIBLE ROUGE CENTRÉE DANS LE TERRAIN */
    .red-target-center {
      position: absolute;
      top: 55%; left: 50%;
      transform: translate(-50%, -50%);
      width: 50px; height: 50px;
      border: 1px dashed var(--stark-red);
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      animation: spin 12s linear infinite;
    }

    .red-target-center::after {
      content: ''; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 4px; height: 4px; background: var(--stark-red);
      border-radius: 50%; box-shadow: 0 0 6px var(--stark-red);
    }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="hud-stage">

    <!-- 1. ÉLÉMENTS EXTÉRIEURS HORS-CADRE (A GAUCHE) -->
    <div class="floating-target-left"></div>

    <div class="floating-code-block">
      SYS.LOC // 48.8566<br>
      REF.NET // 2.3522<br>
      STARK_OS_v5.7<br>
      ----------------<br>
      STAT: ACTIVE<br>
      MODE: TRACKING
    </div>

    <!-- Schéma vectoriel SVG flottant -->
    <svg class="floating-vector-map" viewBox="0 0 100 80">
      <path d="M10 70 L30 40 L60 50 L90 10" fill="none" stroke="#637bff" stroke-width="1" stroke-dasharray="2 2" />
      <circle cx="30" cy="40" r="3" fill="#ff2d55" />
      <circle cx="60" cy="50" r="2" fill="#637bff" />
      <line x1="30" y1="40" x2="30" y2="70" stroke="#ff2d55" stroke-width="0.8" stroke-dasharray="1 2" />
      <line x1="0" y1="70" x2="100" y2="70" stroke="#637bff" stroke-width="0.5" opacity="0.5" />
    </svg>

    <!-- 2. GROUPE PRINCIPAL HUD (CADRES IMBRIQUÉS) -->
    <div class="main-hud-group">
      <div class="hud-mesh-bg"></div>

      <!-- TEXTES FLOTTANTS HORS CADRE AU-DESSUS ET EN-DESSOUS -->
      <div class="tag-b7a">B7 A</div>
      <div class="tag-stark-top">STARK INDUSTRIES</div>
      <div class="tag-v5vb">v5_VB</div>
      <div class="tag-stark-bottom">STARK INDUSTRIES</div>

      <!-- CARTE GAUCHE : GRILLE DE DONNÉES ET MÉTÉO -->
      <div class="data-card">
        <div class="data-header-row">
          <span>SYS_DATA</span>
          <span style="color:var(--stark-red);">● LIVE</span>
        </div>

        <div class="data-grid-table">
          <div class="grid-cell"><div class="cell-lbl">TEMP</div><div class="cell-val" id="val-temp">--°C</div></div>
          <div class="grid-cell"><div class="cell-lbl">WIND</div><div class="cell-val" id="val-wind">--km/h</div></div>
          <div class="grid-cell"><div class="cell-lbl">HUM</div><div class="cell-val" id="val-hum">--%</div></div>
          <div class="grid-cell"><div class="cell-lbl">PRES</div><div class="cell-val" id="val-pres">--hPa</div></div>
          <div class="grid-cell"><div class="cell-lbl">LAT</div><div class="cell-val" id="val-lat">--</div></div>
          <div class="grid-cell"><div class="cell-lbl">LON</div><div class="cell-val" id="val-lon">--</div></div>
        </div>

        <div class="status-bars">
          <div class="status-bar-item"><div class="status-bar-fill" style="width: 80%;"></div></div>
          <div class="status-bar-item"><div class="status-bar-fill" style="width: 45%;"></div></div>
          <div class="status-bar-item"><div class="status-bar-fill" style="width: 90%;"></div></div>
        </div>
      </div>

      <!-- CARTE DROITE : TERRAIN TOPOGRAPHIQUE 3D -->
      <div class="terrain-card">
        <div class="terrain-overlay-coords">E. 473 D. 973</div>
        <div class="terrain-overlay-code">C76</div>

        <canvas id="terrain-canvas"></canvas>

        <div class="red-target-center"></div>
      </div>

    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ── TERRAIN 3D DENSE (THREE.JS) ──
    const canvas = document.getElementById('terrain-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(0, -9, 7.5);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);

    // Maillage plus fin pour ressembler aux courbes de niveau du film
    const geometry = new THREE.PlaneGeometry(20, 20, 45, 45);
    const pos = geometry.attributes.position;

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const z = Math.sin(x * 0.5) * Math.cos(y * 0.5) * 1.4 + Math.sin(x * 1.2) * 0.4;
      pos.setZ(i, z);
    }
    geometry.computeVertexNormals();

    const material = new THREE.MeshBasicMaterial({
      color: 0x637bff,
      wireframe: true,
      transparent: true,
      opacity: 0.6
    });

    const terrain = new THREE.Mesh(geometry, material);
    scene.add(terrain);

    function animate() {
      requestAnimationFrame(animate);
      terrain.rotation.z += 0.002;
      renderer.render(scene, camera);
    }
    animate();

    // ── INJECTION DES DONNÉES RÉELLES GPS / MÉTÉO ──
    async function loadRealData(lat, lon) {
      document.getElementById('val-lat').textContent = lat.toFixed(2);
      document.getElementById('val-lon').textContent = lon.toFixed(2);

      try {
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m`);
        const d = await r.json();

        document.getElementById('val-temp').textContent = `${Math.round(d.current.temperature_2m)}°C`;
        document.getElementById('val-wind').textContent = `${Math.round(d.current.wind_speed_10m)}`;
        document.getElementById('val-hum').textContent = `${d.current.relative_humidity_2m}%`;
        document.getElementById('val-pres').textContent = `${Math.round(d.current.surface_pressure)}`;
      } catch (e) {
        console.error(e);
      }
    }

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        p => loadRealData(p.coords.latitude, p.coords.longitude),
        () => loadRealData(48.85, 2.35)
      );
    } else {
      loadRealData(48.85, 2.35);
    }
  </script>
</body>
</html>
