<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Champions LoL – Galerie Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    .champ-card { transition: transform 0.2s ease; }
    .champ-card:hover { transform: scale(1.07); }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6" id="appRoot">

  <div class="flex justify-between items-center mb-8">
    <h1 class="text-4xl font-bold">Champions League of Legends (172)</h1>

    <!-- Dark mode toggle -->
    <button id="themeToggle" class="p-3 rounded-xl bg-gray-700 hover:bg-gray-600">
      <i data-feather="sun"></i>
    </button>
  </div>

  <!-- Search & Filters -->
  <div class="flex flex-col md:flex-row gap-4 mb-6">
    <input id="searchInput" type="text" placeholder="Rechercher un champion..."
      class="p-3 rounded-xl w-full md:w-1/3 text-black" />

    <select id="roleSelect" class="p-3 rounded-xl text-black w-full md:w-1/4">
      <option value="All">Tous les rôles</option>
      <option value="Top">Top</option>
      <option value="Jungle">Jungle</option>
      <option value="Mid">Mid</option>
      <option value="ADC">ADC</option>
      <option value="Support">Support</option>
    </select>
  </div>

  <!-- Champions grid -->
  <div id="champGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>

  <script>
    feather.replace();

    const roles = {
      Top: ["Garen", "Darius", "Camille", "Fiora", "Shen", "Malphite", "Aatrox"],
      Jungle: ["LeeSin", "KhaZix", "Gragas", "MasterYi", "Wukong", "Elise"],
      Mid: ["Ahri", "Zed", "Yasuo", "Katarina", "Lux", "Vex", "Viktor"],
      ADC: ["Ashe", "Caitlyn", "Jinx", "Ezreal", "Lucian", "Draven"],
      Support: ["Leona", "Thresh", "Nami", "Lulu", "Rakan", "Braum"],
    };

    const champGrid = document.getElementById("champGrid");
    const searchInput = document.getElementById("searchInput");
    const roleSelect = document.getElementById("roleSelect");
    const themeToggle = document.getElementById("themeToggle");
    const appRoot = document.getElementById("appRoot");
    let champions = [];

    // Fetch champions
    fetch("https://ddragon.leagueoflegends.com/cdn/14.21.1/data/fr_FR/champion.json")
      .then(res => res.json())
      .then(data => {
        champions = Object.keys(data.data);
        renderChampions(champions);
      });

    function renderChampions(list) {
      champGrid.innerHTML = list.map(champ => `
        <div class='champ-card rounded-2xl overflow-hidden shadow-xl bg-gray-800 cursor-pointer'>
          <img src="https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${champ}_0.jpg"
               alt="${champ}" class="w-full h-40 object-cover" />
          <div class="p-3 text-center font-semibold">${champ}</div>
        </div>`).join('');
    }

    function filterChampions() {
      const search = searchInput.value.toLowerCase();
      const role = roleSelect.value;

      const filtered = champions.filter(c => {
        const matchSearch = c.toLowerCase().includes(search);
        if (role === "All") return matchSearch;
        return matchSearch && roles[role]?.includes(c);
      });

      renderChampions(filtered);
    }

    searchInput.addEventListener("input", filterChampions);
    roleSelect.addEventListener("change", filterChampions);

    // Dark mode toggle
    themeToggle.addEventListener("click", () => {
      const isDark = appRoot.classList.contains("bg-gray-900");

      if (isDark) {
        appRoot.classList.remove("bg-gray-900", "text-white");
        appRoot.classList.add("bg-gray-200", "text-gray-900");
        themeToggle.innerHTML = '<i data-feather="moon"></i>';
      } else {
        appRoot.classList.add("bg-gray-900", "text-white");
        appRoot.classList.remove("bg-gray-200", "text-gray-900");
        themeToggle.innerHTML = '<i data-feather="sun"></i>';
      }

      feather.replace();
    });
  </script>
</body>
</html>
