<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champions League of Legends - Galerie Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .champion-card {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .champion-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 20px 40px rgba(255, 215, 0, 0.4);
    }

    .champion-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .champion-card:hover img {
      transform: scale(1.1);
    }

    .champion-name {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      padding: 16px 12px 12px;
      font-weight: 700;
      font-size: 1.1rem;
      text-align: center;
      color: #FFD700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .filter-container {
      backdrop-filter: blur(10px);
      background: rgba(31, 41, 55, 0.8);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .light-mode {
      background-color: #f3f4f6 !important;
      color: #1f2937 !important;
    }

    .light-mode .filter-container {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .light-mode .champion-card {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
    }

    .light-mode .champion-card:hover {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .role-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .role-badge:hover {
      transform: scale(1.05);
    }

    .role-badge.active {
      box-shadow: 0 0 20px currentColor;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .champion-card {
      animation: fadeIn 0.4s ease-out;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8">

  <!-- Header -->
  <div class="max-w-7xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
      <div>
        <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-yellow-400 to-orange-500 bg-clip-text text-transparent">
          Champions League of Legends
        </h1>
        <p class="text-gray-400 mt-2" id="championCount">172 champions disponibles</p>
      </div>
      
      <button id="themeToggle" class="p-4 rounded-2xl bg-gray-800 hover:bg-gray-700 transition-all duration-300 shadow-lg hover:shadow-yellow-500/50">
        <svg id="sunIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <svg id="moonIcon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
      </button>
    </div>

    <!-- Filters -->
    <div class="filter-container">
      <div class="flex flex-col gap-4">
        <!-- Search -->
        <div class="relative">
          <input 
            id="searchInput" 
            type="text" 
            placeholder="Rechercher un champion... (Ahri, Yasuo, Jinx...)"
            class="w-full p-4 pl-12 rounded-xl bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-500 transition-all"
          />
          <svg class="w-5 h-5 absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>

        <!-- Role filters -->
        <div class="flex flex-wrap gap-2">
          <span class="text-gray-300 font-semibold mr-2 self-center">Filtrer par rôle:</span>
          <button class="role-badge bg-gray-600 text-white active" data-role="All">Tous</button>
          <button class="role-badge bg-red-600 text-white" data-role="Top">Top</button>
          <button class="role-badge bg-green-600 text-white" data-role="Jungle">Jungle</button>
          <button class="role-badge bg-blue-600 text-white" data-role="Mid">Mid</button>
          <button class="role-badge bg-purple-600 text-white" data-role="ADC">ADC</button>
          <button class="role-badge bg-yellow-600 text-white" data-role="Support">Support</button>
        </div>
      </div>
    </div>

    <!-- Champions Grid -->
    <div id="champGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
      <!-- Champions will be loaded here -->
    </div>

    <!-- No results message -->
    <div id="noResults" class="hidden text-center py-20">
      <svg class="w-24 h-24 mx-auto text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <p class="text-2xl text-gray-400">Aucun champion trouvé</p>
      <p class="text-gray-500 mt-2">Essayez de modifier vos critères de recherche</p>
    </div>
  </div>

  <script>
    // Champions data with roles
    const roles = {
      Top: ["Aatrox", "Camille", "Darius", "Fiora", "Garen", "Gnar", "Illaoi", "Irelia", "Jax", "Jayce", "KSante", "Kennen", "Kled", "Malphite", "Mordekaiser", "Nasus", "Olaf", "Ornn", "Pantheon", "Poppy", "Renekton", "Riven", "Rumble", "Sett", "Shen", "Singed", "Sion", "Teemo", "Tryndamere", "Urgot", "Vladimir", "Volibear", "Wukong", "Yorick"],
      Jungle: ["Amumu", "Belveth", "Brand", "Briar", "Diana", "Ekko", "Elise", "Evelynn", "Fiddlesticks", "Gragas", "Graves", "Hecarim", "Ivern", "JarvanIV", "KhaZix", "Kindred", "LeeSin", "Lillia", "MasterYi", "Nidalee", "Nocturne", "Nunu", "RekSai", "Rengar", "Sejuani", "Shaco", "Shyvana", "Skarner", "Taliyah", "Trundle", "Udyr", "Vi", "Viego", "Warwick", "Wukong", "XinZhao", "Zac"],
      Mid: ["Ahri", "Akali", "Anivia", "Annie", "AurelionSol", "Aurora", "Azir", "Cassiopeia", "Corki", "Diana", "Ekko", "Fizz", "Galio", "Hwei", "Irelia", "Kassadin", "Katarina", "Leblanc", "Lissandra", "Lux", "Malzahar", "Neeko", "Orianna", "Qiyana", "Ryze", "Sylas", "Syndra", "Talon", "TwistedFate", "Veigar", "Vex", "Viktor", "Vladimir", "Xerath", "Yasuo", "Yone", "Zed", "Ziggs", "Zoe"],
      ADC: ["Aphelios", "Ashe", "Caitlyn", "Draven", "Ezreal", "Jhin", "Jinx", "KaiSa", "Kalista", "KogMaw", "Lucian", "MissFortune", "Nilah", "Samira", "Sivir", "Smolder", "Tristana", "Twitch", "Varus", "Vayne", "Xayah", "Zeri"],
      Support: ["Alistar", "Bard", "Blitzcrank", "Braum", "Janna", "Karma", "Leona", "Lulu", "Lux", "Milio", "Morgana", "Nami", "Nautilus", "Pyke", "Rakan", "Rell", "Renata", "Senna", "Seraphine", "Sona", "Soraka", "Taric", "Thresh", "Yuumi", "Zilean", "Zyra"]
    };

    const champGrid = document.getElementById("champGrid");
    const searchInput = document.getElementById("searchInput");
    const themeToggle = document.getElementById("themeToggle");
    const sunIcon = document.getElementById("sunIcon");
    const moonIcon = document.getElementById("moonIcon");
    const noResults = document.getElementById("noResults");
    const championCount = document.getElementById("championCount");
    const roleButtons = document.querySelectorAll(".role-badge");

    let allChampions = [];
    let currentRole = "All";

    // Fetch all champions from Riot API
    fetch("https://ddragon.leagueoflegends.com/cdn/14.23.1/data/fr_FR/champion.json")
      .then(res => res.json())
      .then(data => {
        allChampions = Object.keys(data.data).sort();
        renderChampions(allChampions);
      })
      .catch(err => {
        console.error("Erreur de chargement:", err);
        champGrid.innerHTML = '<p class="col-span-full text-center text-red-400">Erreur de chargement des champions</p>';
      });

    function renderChampions(champions) {
      if (champions.length === 0) {
        champGrid.classList.add("hidden");
        noResults.classList.remove("hidden");
        championCount.textContent = "Aucun champion trouvé";
        return;
      }

      champGrid.classList.remove("hidden");
      noResults.classList.add("hidden");
      championCount.textContent = `${champions.length} champion${champions.length > 1 ? 's' : ''} trouvé${champions.length > 1 ? 's' : ''}`;

      champGrid.innerHTML = champions.map(champ => `
        <a href="__FirstApp__/Perso/JV/Lol/${champ}.html" class="champion-card">
          <img 
            src="https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${champ}_0.jpg"
            alt="${champ}"
            loading="lazy"
          />
          <div class="champion-name">${champ}</div>
        </a>
      `).join('');
    }

    function filterChampions() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      
      let filtered = allChampions.filter(champ => 
        champ.toLowerCase().includes(searchTerm)
      );

      if (currentRole !== "All") {
        filtered = filtered.filter(champ => 
          roles[currentRole]?.includes(champ)
        );
      }

      renderChampions(filtered);
    }

    // Search input event
    searchInput.addEventListener("input", filterChampions);

    // Role filter events
    roleButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        roleButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentRole = btn.dataset.role;
        filterChampions();
      });
    });

    // Theme toggle
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      sunIcon.classList.toggle("hidden");
      moonIcon.classList.toggle("hidden");
      
      if (document.body.classList.contains("light-mode")) {
        searchInput.classList.remove("bg-gray-700", "text-white");
        searchInput.classList.add("bg-white", "text-gray-900");
      } else {
        searchInput.classList.add("bg-gray-700", "text-white");
        searchInput.classList.remove("bg-white", "text-gray-900");
      }
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === "Escape" && document.activeElement === searchInput) {
        searchInput.value = "";
        searchInput.blur();
        filterChampions();
      }
    });
  </script>
</body>
</html>
