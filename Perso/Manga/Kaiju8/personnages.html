<html lang="fr">
<head>

<style>

/* ── FILTER BAR ── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 20px 64px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.filter-label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-right: 4px;
}

.filter-btn {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 5px 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
}

.filter-btn:hover { color: var(--text-secondary); border-color: var(--border-strong); }

.filter-btn.active {
  color: var(--accent);
  border-color: rgba(81,252,243,0.3);
  background: var(--accent-dim);
}

/* ── GRID ── */
.chars-grid {
  padding: 40px 64px 80px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1px;
  background: var(--border);
}

/* ── CHARACTER CARD ── */
.char-card {
  background: var(--bg);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background 0.2s;
  display: flex;
  flex-direction: column;
}

.char-card:hover { background: var(--bg-card); }

.char-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--card-accent, var(--border));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
}

.char-card:hover::before { transform: scaleX(1); }

/* accent par division */
.char-card[data-div="1"]  { --card-accent: var(--mina-mint); }
.char-card[data-div="2"]  { --card-accent: var(--hoshina-purple); }
.char-card[data-div="3"]  { --card-accent: var(--kikoru-gold); }
.char-card[data-div="dir"]{ --card-accent: var(--df-beige); }
.char-card[data-div="kaiju"]{ --card-accent: var(--kaiju10-red); }

.char-photo {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  object-position: top;
  display: block;
}

.char-photo-slot {
  width: 100%;
  aspect-ratio: 3/4;
  background: var(--bg-panel);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.2s;
  position: relative;
}

.char-photo-slot:hover { background: rgba(255,255,255,0.02); }

.char-photo-slot .slot-label {
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-dim);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
  padding: 0 16px;
}

.char-photo-slot .slot-icon {
  width: 36px; height: 36px;
  border: 1px dashed rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; opacity: 0.25;
}

.char-body {
  padding: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.char-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.char-name-jp {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  margin-bottom: 2px;
}

.char-name {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #fff;
  line-height: 1;
}

.char-role {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-secondary);
  letter-spacing: 0.06em;
  margin-top: 4px;
}

.char-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.char-stats { flex: 1; }

.char-bio {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.65;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.char-meta-row {
  display: flex;
  gap: 20px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.char-meta-item { display: flex; flex-direction: column; gap: 2px; }

.char-meta-label {
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.char-meta-val {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
}

/* ── DETAIL OVERLAY ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,9,13,0.92);
  z-index: 200;
  overflow-y: auto;
  backdrop-filter: blur(6px);
}

.overlay.open { display: block; }

.overlay-inner {
  max-width: 860px;
  margin: 0 auto;
  padding: 80px 40px 80px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.overlay-close {
  position: fixed;
  top: 20px; right: 28px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
  letter-spacing: 0.12em;
  padding: 8px 16px;
  border: 1px solid var(--border);
  z-index: 201;
  background: var(--bg);
  transition: all 0.15s;
}

.overlay-close:hover { color: var(--text-primary); border-color: var(--border-strong); }

.overlay-header {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 40px;
  margin-bottom: 40px;
  padding-bottom: 40px;
  border-bottom: 1px solid var(--border);
}

.overlay-photo-slot {
  width: 100%; aspect-ratio: 3/4;
  background: var(--bg-panel);
  border: 1px dashed rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px; cursor: pointer;
}

.overlay-photo-slot span {
  font-family: var(--font-mono);
  font-size: 8px; color: var(--text-dim);
  letter-spacing: 0.14em; text-transform: uppercase;
  text-align: center; padding: 0 16px;
}

.overlay-info { display: flex; flex-direction: column; justify-content: center; gap: 16px; }

.overlay-name-jp { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; }

.overlay-name {
  font-family: var(--font-display);
  font-size: 52px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #fff;
  line-height: 0.92;
}

.overlay-role { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); letter-spacing: 0.08em; }

.overlay-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  margin-bottom: 32px;
  border: 1px solid var(--border);
}

.overlay-stat {
  background: var(--bg-panel);
  padding: 16px;
}

.overlay-stat-label {
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-dim);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.overlay-stat-val {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.04em;
}

.overlay-section-title {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 12px;
  margin-top: 28px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.overlay-bio {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.8;
}

.overlay-abilities {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

@media (max-width: 768px) {
  .filter-bar, .chars-grid { padding-left: 20px; padding-right: 20px; }
  .overlay-header { grid-template-columns: 1fr; }
  .overlay-name { font-size: 36px; }
  .overlay-stats-grid { grid-template-columns: 1fr 1fr; }
}
</style>

function buildCards() {
  const grid = document.getElementById('chars-grid');
  grid.innerHTML = chars.map(c => `
    <div class="char-card card" data-div="${c.div}" onclick="openOverlay(${c.id})">
      <div class="char-photo-slot" onclick="event.stopPropagation();this.querySelector('input').click()">
        <div class="slot-icon">⊕</div>
        <div class="slot-label">Photo / Illustration<br>${c.name}</div>
        <input type="file" accept="image/*" style="display:none" onchange="loadCardPhoto(this)">
      </div>
      <div class="char-body">
        <div class="char-head">
          <div>
            <div class="char-name-jp">${c.jp}</div>
            <div class="char-name">${c.name}</div>
            <div class="char-role">${c.role}</div>
          </div>
          <span class="rank rank-${c.tags[1]}">${c.tags[1]}</span>
        </div>
        <div class="char-tags">
          ${c.tags.slice(2).map(t => `<span class="tag tag-df">${t}</span>`).join('')}
        </div>
        <div class="stat-bar-wrap char-stats">
          ${c.bars.slice(0,3).map(b => `
            <div class="stat-bar-row">
              <span class="stat-bar-label">${b.l}</span>
              <div class="stat-bar-track"><div class="stat-bar-fill ${b.c}" style="width:0%" data-w="${b.v}%"></div></div>
              <span class="stat-bar-val">${b.v}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');
  setTimeout(() => {
    document.querySelectorAll('.stat-bar-fill').forEach(el => el.style.width = el.dataset.w);
  }, 50);
}

function loadCardPhoto(input) {
  const file = input.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  const slot = input.closest('.char-photo-slot');
  slot.innerHTML = `<img class="char-photo" src="${url}">`;
}

function filter(btn, div) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.char-card').forEach(c => {
    c.style.display = (div === 'all' || c.dataset.div === div) ? 'flex' : 'none';
  });
}

function openOverlay(id) {
  const c = chars.find(x => x.id === id);
  document.getElementById('ov-jp').textContent = c.jp;
  document.getElementById('ov-name').textContent = c.name;
  document.getElementById('ov-role').textContent = c.role;
  document.getElementById('ov-tags').innerHTML = c.tags.map((t,i) => i % 2 === 0 ? `<span class="tag ${c.tags[i]}">${c.tags[i+1] || ''}</span>` : '').join('');
  document.getElementById('ov-stats').innerHTML = c.stats.map(s => `
    <div class="overlay-stat">
      <div class="overlay-stat-label">${s.l}</div>
      <div class="overlay-stat-val">${s.v}</div>
    </div>`).join('');
  document.getElementById('ov-bars').innerHTML = c.bars.map(b => `
    <div class="stat-bar-row">
      <span class="stat-bar-label">${b.l}</span>
      <div class="stat-bar-track"><div class="stat-bar-fill ${b.c}" style="width:0%" data-w="${b.v}%"></div></div>
      <span class="stat-bar-val">${b.v}</span>
    </div>`).join('');
  document.getElementById('ov-bio').textContent = c.bio;
  document.getElementById('ov-abilities').innerHTML = c.abilities.map(a => `<span class="tag tag-df">${a}</span>`).join('');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    document.querySelectorAll('#ov-bars .stat-bar-fill').forEach(el => el.style.width = el.dataset.w);
  }, 60);
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function loadOvPhoto(input) {
  const file = input.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  const slot = input.closest('.overlay-photo-slot');
  slot.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;object-position:top">`;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

buildCards();
</script>
